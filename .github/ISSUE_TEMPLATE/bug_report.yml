name: Bug report
description: Report reproducible Tilecast behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      {
        label: Description,
        description: What happened and what did you expect?,
      }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Tilecast version }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      {
        label: Environment,
        description: Host OS,
        browser or device,
        and deployment method,
      }
