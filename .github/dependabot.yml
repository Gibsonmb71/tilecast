version: 2

updates:
  # Dashboard and shared npm workspace packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # The Linux player targets ~2012 hardware (Ivy Bridge / Intel HD 4000 /
      # 4 GB). A major Electron bump is a large Chromium jump that must be
      # validated on a device (GPU/VA-API/overlay behavior, memory) before we
      # take it, so hold Electron on its current major and only allow
      # minor/patch updates. Bump the major deliberately in its own PR.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]

  # Go server
  - package-ecosystem: "gomod"
    directory: "/apps/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Android player
  - package-ecosystem: "gradle"
    directory: "/apps/player-android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      android-dependencies:
        patterns:
          - "*"
    ignore:
      # The Kotlin plugins are deliberately held back in
      # apps/player-android/build.gradle.kts: the CodeQL extractor does not yet
      # support Kotlin 2.4.10, and AGP 9 takes its compiler version from these
      # plugin declarations, so bumping them fails the CodeQL analysis. Without
      # this, Dependabot reproposes the bump every week. Remove the ignore when
      # the extractor supports the newer Kotlin, and bump deliberately.
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"

  # Server container base images
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      docker-images:
        patterns:
          - "*"

  # Actions used by GitHub workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      github-actions:
        patterns:
          - "*"
