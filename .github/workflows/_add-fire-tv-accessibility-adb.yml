name: Apply Fire TV accessibility ADB guidance

on:
  push:
    branches: [main]
    paths: [.github/workflows/_add-fire-tv-accessibility-adb.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add ADB guidance and dashboard command
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('apps/player-android/app/src/main/java/org/tilecast/player/reliability/CommissioningController.kt')
          text = controller.read_text()
          old = 'accessibilityEnabled = accessibilitySupported && reliability.accessibilityEnabled(),'
          new = 'accessibilityEnabled = reliability.accessibilityEnabled(),'
          if old not in text:
              raise SystemExit('CommissioningController marker not found')
          controller.write_text(text.replace(old, new, 1))

          screen = Path('apps/player-android/app/src/main/java/org/tilecast/player/ui/CommissioningScreen.kt')
          text = screen.read_text()
          old = '''                Text(
                    "Fire OS does not expose the standard Android screen for enabling Tilecast’s accessibility service. Tilecast will continue without accessibility-assisted app return or lock actions on this device.",
                    color = SignalMuted,
                    fontSize = 18.sp,
                )
                Spacer(Modifier.height(14.dp))
                Text("This limitation will remain visible in Tilecast Studio.", color = SignalWarning, fontSize = 17.sp)'''
          new = '''                Text(
                    "Fire OS does not expose the standard Android screen for enabling Tilecast’s accessibility service. You may continue without it, or enable it manually with ADB using the command shown in Tilecast Studio under this screen’s Reliability tab.",
                    color = SignalMuted,
                    fontSize = 18.sp,
                )
                Spacer(Modifier.height(14.dp))
                if (state.accessibilityEnabled) {
                    StatusLine("ADB-enabled Accessibility Control", true)
                } else {
                    Text("Optional: enable ADB debugging on the Fire TV, run the Studio command, then choose Verify again.", color = SignalWarning, fontSize = 17.sp)
                }'''
          if old not in text:
              raise SystemExit('CommissioningScreen marker not found')
          screen.write_text(text.replace(old, new, 1))

          dashboard = Path('apps/dashboard/src/pages/ScreensPage.tsx')
          text = dashboard.read_text()
          marker = '''const codeSchema = z.object({
  code: z.string().trim().min(6, "Enter the six-character code").max(9),
});'''
          replacement = '''const FIRE_TV_ACCESSIBILITY_ADB_COMMAND =
  `adb shell 'component="org.tilecast.player/org.tilecast.player.reliability.TilecastAccessibilityService"; current=$(settings get secure enabled_accessibility_services); [ "$current" = "null" ] && current=""; case ":$current:" in *":$component:"*) ;; *) current="${current:+$current:}$component" ;; esac; settings put secure enabled_accessibility_services "$current"; settings put secure accessibility_enabled 1'`;

const codeSchema = z.object({
  code: z.string().trim().min(6, "Enter the six-character code").max(9),
});'''
          if marker not in text:
              raise SystemExit('dashboard constant marker not found')
          text = text.replace(marker, replacement, 1)

          marker = '  const [selectedPlaylist, setSelectedPlaylist] = useState("");'
          replacement = '''  const [selectedPlaylist, setSelectedPlaylist] = useState("");
  const [showAccessibilityAdb, setShowAccessibilityAdb] = useState(false);'''
          if marker not in text:
              raise SystemExit('dashboard state marker not found')
          text = text.replace(marker, replacement, 1)

          marker = '''          {reliabilityCapabilityWarning(reliability.data) && (
            <div className="notice notice--warning">
              {reliabilityCapabilityWarning(reliability.data)}
            </div>
          )}
          {canManageScreens(auth.status?.user) && ('''
          replacement = '''          {reliabilityCapabilityWarning(reliability.data) && (
            <div className="notice notice--warning">
              {reliabilityCapabilityWarning(reliability.data)}
            </div>
          )}
          {(screen.platform === "fire-tv" ||
            screen.deviceManufacturer.toLowerCase() === "amazon") && (
            <div className="notice notice--warning">
              <strong>Optional Fire TV Accessibility Control</strong>
              <p>
                Fire OS does not expose Tilecast in its normal Accessibility menu.
                Commissioning may continue without this feature, or an administrator
                can enable the service manually through ADB.
              </p>
              <button
                type="button"
                className="button button--quiet"
                onClick={() => setShowAccessibilityAdb((shown) => !shown)}
              >
                {showAccessibilityAdb ? "Hide ADB command" : "Show ADB command"}
              </button>
              {showAccessibilityAdb && (
                <div>
                  <pre>
                    <code>{FIRE_TV_ACCESSIBILITY_ADB_COMMAND}</code>
                  </pre>
                  <button
                    type="button"
                    className="button button--quiet"
                    onClick={() =>
                      void navigator.clipboard.writeText(
                        FIRE_TV_ACCESSIBILITY_ADB_COMMAND,
                      )
                    }
                  >
                    Copy command
                  </button>
                  <p>
                    Enable ADB debugging on the Fire TV, connect with <code>adb
                    connect FIRE_TV_IP</code>, run the command, then reopen Tilecast
                    Player and choose Verify again. The command preserves any other
                    enabled accessibility services.
                  </p>
                </div>
              )}
            </div>
          )}
          {canManageScreens(auth.status?.user) && ('''
          if marker not in text:
              raise SystemExit('dashboard reliability marker not found')
          dashboard.write_text(text.replace(marker, replacement, 1))
          PY
          rm .github/workflows/_add-fire-tv-accessibility-adb.yml
      - name: Format and verify Studio
        run: |
          npm ci
          npm run format -- apps/dashboard/src/pages/ScreensPage.tsx
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Verify Android player
        working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Fire TV accessibility ADB guidance'
          git push origin HEAD:main
