name: Apply branding settings fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/branding-settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/branding-settings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply cleanup
        run: |
          set -euo pipefail
          python3 scripts/apply-branding-settings-fix.py
          rm scripts/apply-branding-settings-fix.py .github/workflows/_apply-branding-settings-fix.yml
          npm exec prettier -- --write \
            apps/dashboard/src/pages/SettingsPage.tsx \
            apps/dashboard/src/settings/BrandingAssets.tsx \
            apps/dashboard/src/settings/BrandingAssets.css \
            apps/dashboard/src/settings/SettingsSection.tsx \
            apps/dashboard/src/settings/settingDisplay.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify branding settings and add image uploads'
          git push origin HEAD:fix/branding-settings
      - name: Verify dashboard
        run: |
          set -euo pipefail
          npm run format:check --workspace @tilecast/dashboard
          npm run lint --workspace @tilecast/dashboard
          npm test --workspace @tilecast/dashboard
          npm run build --workspace @tilecast/dashboard
