name: Apply live preview wiring

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-verify:
    if: github.head_ref == 'feature/live-screen-previews' || github.ref == 'refs/heads/feature/live-screen-previews'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-screen-previews
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/server/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply MainActivity wiring
        run: python3 scripts/apply-live-preview-main-activity.py

      - name: Format changed files
        run: |
          gofmt -w apps/server/internal/previews/service.go apps/server/internal/previews/service_test.go apps/server/internal/httpapi/previews.go
          npm ci
          npx prettier --write \
            apps/dashboard/src/App.tsx \
            apps/dashboard/src/api/previews.ts \
            apps/dashboard/src/components/LivePreviewPanel.tsx \
            apps/dashboard/src/components/LivePreviewPanel.css \
            apps/dashboard/src/components/livePreviewState.ts \
            apps/dashboard/src/components/livePreviewState.test.ts \
            apps/dashboard/src/pages/ScreenDetailWithPreviewPage.tsx

      - name: Test Go server
        working-directory: apps/server
        run: go test ./internal/previews ./internal/httpapi

      - name: Check Studio
        run: |
          npm run lint --workspace @tilecast/dashboard
          npm test --workspace @tilecast/dashboard
          npm run build --workspace @tilecast/dashboard

      - name: Check Android player
        working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Commit verified implementation
        run: |
          rm scripts/apply-live-preview-main-activity.py
          rm .github/workflows/_apply-live-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add on-demand player live previews"
          git push origin HEAD:feature/live-screen-previews
