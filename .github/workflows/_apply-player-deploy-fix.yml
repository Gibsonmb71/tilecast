name: Apply player deployment reliability fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_apply-player-deploy-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: npm ci
      - name: Apply fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet not found in {path}:\n{old}")
              file.write_text(text.replace(old, new, 1))

          settings = "apps/dashboard/src/settings/SettingsOperations.tsx"
          replace(
              settings,
              '''    onSuccess: () => {
              setScreenIds([]);
              setGroupIds([]);
              void client.invalidateQueries({ queryKey: ["update-deployments"] });
            },
          });
          ''',
              '''    onSuccess: () => {
              setScreenIds([]);
              setGroupIds([]);
              void client.invalidateQueries({ queryKey: ["update-deployments"] });
            },
          });
          ''',
          )
          replace(
              settings,
              '''          <button
                      className="button button--primary"
                      disabled={
                        !releaseId ||
                        !selectedScreens.length ||
                        deploy.isPending ||
                        (mode === "maintenance_window" && !windowStart)
                      }
                      onClick={() => {
                        if (
                          confirm(
                            "Deploy player update? Android may require approval on each TV.",
                          )
                        )
                          deploy.mutate();
                      }}
                    >
                      Deploy player update
                    </button>
          ''',
              '''          {deploy.error && (
                      <div className="notice notice--error" role="alert">
                        <strong>Player update was not deployed.</strong>
                        <p>{deploy.error.message}</p>
                      </div>
                    )}
                    {deploy.isSuccess && deploy.data && (
                      <div className="notice notice--success" role="status">
                        <strong>
                          Deployment created for {deploy.data.targetCount} screen
                          {deploy.data.targetCount === 1 ? "" : "s"}.
                        </strong>
                        <p>
                          Online players will receive the command immediately and retry
                          it during the next server heartbeat if the first notification
                          is missed.
                        </p>
                      </div>
                    )}
                    <button
                      type="button"
                      className="button button--primary"
                      disabled={
                        !releaseId ||
                        !selectedScreens.length ||
                        deploy.isPending ||
                        (mode === "maintenance_window" && !windowStart)
                      }
                      onClick={() => deploy.mutate()}
                    >
                      {deploy.isPending
                        ? "Creating deployment…"
                        : "Deploy player update"}
                    </button>
          ''',
          )

          socket = "apps/server/internal/httpapi/player_socket.go"
          replace(
              socket,
              '''\t\t\tcase timestamp := <-ticker.C:
\t\t\t\tif err := send(map[string]any{"type": "server.ping", "timestamp": timestamp.UTC().Format(time.RFC3339)}); err != nil {
\t\t\t\t\tcancel()
\t\t\t\t\treturn
\t\t\t\t}
          ''',
              '''\t\t\tcase timestamp := <-ticker.C:
\t\t\t\tvar commandsWaiting bool
\t\t\t\tif err := s.db.QueryRow(ctx, `SELECT EXISTS(SELECT 1 FROM player_commands WHERE screen_id=$1 AND state IN ('pending','delivered','acknowledged','running') AND expires_at>now())`, principal.ScreenID).Scan(&commandsWaiting); err == nil && commandsWaiting {
\t\t\t\t\tif err := send(map[string]any{"type": "commands.available"}); err != nil {
\t\t\t\t\t\tcancel()
\t\t\t\t\t\treturn
\t\t\t\t\t}
\t\t\t\t}
\t\t\t\tif err := send(map[string]any{"type": "server.ping", "timestamp": timestamp.UTC().Format(time.RFC3339)}); err != nil {
\t\t\t\t\tcancel()
\t\t\t\t\treturn
\t\t\t\t}
          ''',
          )
          PY
          gofmt -w apps/server/internal/httpapi/player_socket.go
      - name: Verify dashboard
        run: npm run build --workspace apps/dashboard
      - name: Verify server
        working-directory: apps/server
        run: go test ./internal/httpapi ./internal/devices
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_apply-player-deploy-fix.yml
          git add apps/dashboard/src/settings/SettingsOperations.tsx apps/server/internal/httpapi/player_socket.go
          git commit -m "Fix player update deployment feedback and delivery"
          git push origin main
