name: Apply Player update catalog fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/player-update-catalog'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: tilecast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-update-catalog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and verify fix
        env:
          TILECAST_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tilecast_test?sslmode=disable
        run: |
          set -euo pipefail
          python3 scripts/fix-player-update-catalog.py
          rm scripts/fix-player-update-catalog.py .github/workflows/_apply-player-update-catalog-fix.yml
          gofmt -w apps/server/internal/httpapi/updates.go
          npm exec prettier -- --write apps/dashboard/src/settings/SettingsOperations.tsx
          go vet ./...
          go test ./...
          npm run format:check --workspace @tilecast/dashboard
          npm run lint --workspace @tilecast/dashboard
          npm test --workspace @tilecast/dashboard
          npm run build --workspace @tilecast/dashboard
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Player release synchronization'
          git push origin HEAD:fix/player-update-catalog
