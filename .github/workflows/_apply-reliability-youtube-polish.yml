name: Apply reliability and YouTube polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-android-polish
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 scripts/apply-reliability-youtube-polish.py
          rm scripts/apply-reliability-youtube-polish.py .github/workflows/_apply-reliability-youtube-polish.yml
      - name: Verify dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run format
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Verify Android
        working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish reliability controls and YouTube playback'
          git push origin HEAD:audit/dashboard-android-polish
