name: Apply dashboard and Android audit fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-android-polish
          fetch-depth: 0
      - name: Apply focused fixes
        run: python3 scripts/apply-dashboard-android-audit.py
      - name: Remove temporary files
        run: rm -f scripts/apply-dashboard-android-audit.py .github/workflows/_audit-dashboard-android.yml
      - name: Verify dashboard
        run: |
          npm ci
          npm run format
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Verify Android player
        working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix dashboard and player reliability issues'
          git push origin HEAD:audit/dashboard-android-polish
