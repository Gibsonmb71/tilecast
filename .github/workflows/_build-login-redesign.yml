name: Build login redesign

on:
  push:
    branches: [feat/login-background]

permissions:
  contents: write

concurrency:
  group: build-login-redesign
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/login-background
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: npm ci
      - name: Implement configurable centered login
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'apps/server/internal/settings/registry.go',
              '{Key: "branding.icon_asset_id", Category: "branding", Type: "uuid_or_empty", Default: "", Scope: ScopeOrganization, Title: "Square icon"},',
              '{Key: "branding.icon_asset_id", Category: "branding", Type: "uuid_or_empty", Default: "", Scope: ScopeOrganization, Title: "Square icon"},\n\t{Key: "branding.login_background_asset_id", Category: "branding", Type: "uuid_or_empty", Default: "", Scope: ScopeOrganization, Title: "Login background"},',
          )

          replace(
              'apps/server/internal/settings/service.go',
              'for _, key := range []string{"branding.logo_asset_id", "branding.icon_asset_id"} {',
              'for _, key := range []string{"branding.logo_asset_id", "branding.icon_asset_id", "branding.login_background_asset_id"} {',
          )

          replace(
              'apps/server/internal/httpapi/server.go',
              'api.Get("/auth/status", s.authStatus)\n',
              'api.Get("/auth/status", s.authStatus)\n\t\tapi.Get("/auth/background", s.loginBackground)\n',
          )

          old_auth = '''\tresult := map[string]any{"setupRequired": required, "authenticated": false}
\tif !required {
'''
          new_auth = '''\tresult := map[string]any{"setupRequired": required, "authenticated": false}
\tif !required && s.settings != nil {
\t\tif document, settingsErr := s.settings.Organization(r.Context()); settingsErr == nil {
\t\t\tif name, ok := document.Values["organization.name"].(string); ok && name != "" {
\t\t\t\tresult["organizationName"] = name
\t\t\t}
\t\t\tif backgroundID, ok := document.Values["branding.login_background_asset_id"].(string); ok && backgroundID != "" {
\t\t\t\tresult["loginBackgroundUrl"] = "/api/v1/auth/background"
\t\t\t}
\t\t}
\t}
\tif !required {
'''
          replace('apps/server/internal/httpapi/server.go', old_auth, new_auth)

          marker = '''func (s *server) assetThumbnail(w http.ResponseWriter, r *http.Request) {
'''
          handler = '''func (s *server) loginBackground(w http.ResponseWriter, r *http.Request) {
\tif s.settings == nil || s.media == nil {
\t\thttp.NotFound(w, r)
\t\treturn
\t}
\tdocument, err := s.settings.Organization(r.Context())
\tif err != nil {
\t\ts.internalError(w, r, err)
\t\treturn
\t}
\tvalue, _ := document.Values["branding.login_background_asset_id"].(string)
\tid, err := uuid.Parse(value)
\tif err != nil {
\t\thttp.NotFound(w, r)
\t\treturn
\t}
\tdelivery, err := s.media.Preview(r.Context(), id)
\tif err != nil {
\t\thttp.NotFound(w, r)
\t\treturn
\t}
\tw.Header().Set("Cache-Control", "public, max-age=300")
\tserveDelivery(w, r, delivery)
}

'''
          replace('apps/server/internal/httpapi/media.go', marker, handler + marker)

          replace(
              'apps/server/internal/httpapi/middleware.go',
              "img-src 'self' data:;",
              "img-src 'self' data: https://images.unsplash.com;",
          )

          replace(
              'apps/dashboard/src/api/types.ts',
              '''export type AuthStatus = {
  setupRequired: boolean;
  authenticated: boolean;
  user?: User;
  csrfToken?: string;
};''',
              '''export type AuthStatus = {
  setupRequired: boolean;
  authenticated: boolean;
  user?: User;
  csrfToken?: string;
  organizationName?: string;
  loginBackgroundUrl?: string;
};''',
          )

          replace(
              'apps/dashboard/src/settings/BrandingAssets.tsx',
              '''        <BrandingAssetUpload
          settingKey="branding.icon_asset_id"
          title="Square icon"
          description="A square mark for compact branding and icon-sized placements."
          value={stringValue(values["branding.icon_asset_id"])}
          editable={editable}
          onChange={onChange}
        />''',
              '''        <BrandingAssetUpload
          settingKey="branding.icon_asset_id"
          title="Square icon"
          description="A square mark for compact branding and icon-sized placements."
          value={stringValue(values["branding.icon_asset_id"])}
          editable={editable}
          onChange={onChange}
        />
        <BrandingAssetUpload
          settingKey="branding.login_background_asset_id"
          title="Login background"
          description="A landscape image shown behind the Tilecast Studio sign-in panel."
          value={stringValue(values["branding.login_background_asset_id"])}
          editable={editable}
          onChange={onChange}
        />''',
          )

          replace(
              'apps/dashboard/src/pages/SettingsPage.tsx',
              '''              "branding.icon_asset_id",
              "branding.primary_color",''',
              '''              "branding.icon_asset_id",
              "branding.login_background_asset_id",
              "branding.primary_color",''',
          )

          Path('apps/dashboard/src/pages/AuthPage.tsx').write_text(r'''import { zodResolver } from "@hookform/resolvers/zod";
import { useEffect } from "react";
import { useForm } from "react-hook-form";
import { useLocation, useNavigate } from "react-router";
import { useAuth } from "../auth/AuthProvider";
import {
  loginSchema,
  setupSchema,
  type LoginForm,
  type SetupForm,
} from "../auth/schemas";
import { Brand } from "../components/Brand";
import { FormField } from "../components/FormField";
import "./AuthPage.css";

const defaultBackground =
  "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=88&w=2400";

export function AuthPage({ mode }: { mode: "setup" | "login" }) {
  const auth = useAuth();
  const navigate = useNavigate();
  const location = useLocation();
  const requestedReturn = new URLSearchParams(location.search).get("returnTo");
  const returnTo =
    requestedReturn?.startsWith("/") && !requestedReturn.startsWith("//")
      ? requestedReturn
      : "/";

  useEffect(() => {
    if (auth.status?.authenticated) void navigate(returnTo, { replace: true });
    else if (auth.status && mode === "setup" && !auth.status.setupRequired)
      void navigate("/login", { replace: true });
    else if (auth.status?.setupRequired && mode === "login")
      void navigate("/setup", { replace: true });
  }, [auth.status, mode, navigate, returnTo]);

  if (auth.isLoading) return <LoadingScreen />;

  const background = auth.status?.loginBackgroundUrl ?? defaultBackground;
  return (
    <main
      className="auth-page auth-page--centered"
      style={{ backgroundImage: `url(${JSON.stringify(background).slice(1, -1)})` }}
    >
      <div className="auth-page__shade" aria-hidden="true" />
      <div className="auth-page__content">
        {mode === "setup" ? <SetupFormView /> : <LoginFormView />}
      </div>
      {!auth.status?.loginBackgroundUrl && (
        <a
          className="auth-photo-credit"
          href="https://unsplash.com/photos/Bkci_8qcdvQ"
          target="_blank"
          rel="noreferrer"
        >
          Photo by Kalen Emsley on Unsplash
        </a>
      )}
    </main>
  );
}

function StudioLogo() {
  return (
    <img
      className="auth-studio-logo"
      src="/tilecast-studio-logo.svg"
      alt="Tilecast Studio"
    />
  );
}

function SetupFormView() {
  const { setup, error, isSubmitting } = useAuth();
  const form = useForm<SetupForm>({
    resolver: zodResolver(setupSchema),
    defaultValues: {
      organizationName: "",
      ownerName: "",
      username: "",
      password: "",
      confirmPassword: "",
    },
  });
  const submit = form.handleSubmit(async (values) => {
    await setup({
      organizationName: values.organizationName,
      ownerName: values.ownerName,
      username: values.username,
      password: values.password,
    });
  });
  return (
    <section className="auth-card auth-card--setup" aria-labelledby="setup-title">
      <StudioLogo />
      <header>
        <h1 id="setup-title">Set up Tilecast</h1>
        <p>Create the first owner account for this installation.</p>
      </header>
      {error && (
        <div className="notice notice--error" role="alert">
          {error.message}
        </div>
      )}
      <form onSubmit={(event) => void submit(event)} noValidate>
        <FormField
          id="organizationName"
          label="Organization name"
          autoComplete="organization"
          error={form.formState.errors.organizationName?.message}
          {...form.register("organizationName")}
        />
        <FormField
          id="ownerName"
          label="Your name"
          autoComplete="name"
          error={form.formState.errors.ownerName?.message}
          {...form.register("ownerName")}
        />
        <FormField
          id="username"
          label="Email or username"
          autoComplete="username"
          error={form.formState.errors.username?.message}
          {...form.register("username")}
        />
        <div className="form-grid">
          <FormField
            id="password"
            label="Password"
            type="password"
            autoComplete="new-password"
            hint="At least 12 characters"
            error={form.formState.errors.password?.message}
            {...form.register("password")}
          />
          <FormField
            id="confirmPassword"
            label="Confirm password"
            type="password"
            autoComplete="new-password"
            error={form.formState.errors.confirmPassword?.message}
            {...form.register("confirmPassword")}
          />
        </div>
        <button className="button button--primary" type="submit" disabled={isSubmitting}>
          {isSubmitting ? "Creating installation…" : "Create installation"}
        </button>
      </form>
    </section>
  );
}

function LoginFormView() {
  const { login, error, isSubmitting, status } = useAuth();
  const form = useForm<LoginForm>({
    resolver: zodResolver(loginSchema),
    defaultValues: { username: "", password: "" },
  });
  const submit = form.handleSubmit(async (values) => {
    await login(values);
  });
  return (
    <section className="auth-card auth-card--login" aria-labelledby="login-title">
      <StudioLogo />
      <header>
        <h1 id="login-title">Sign in</h1>
        <p>{status?.organizationName ?? "Tilecast Studio"}</p>
      </header>
      {error && (
        <div className="notice notice--error" role="alert">
          {error.message}
        </div>
      )}
      <form onSubmit={(event) => void submit(event)} noValidate>
        <FormField
          id="username"
          label="Email or username"
          autoComplete="username"
          autoFocus
          error={form.formState.errors.username?.message}
          {...form.register("username")}
        />
        <FormField
          id="password"
          label="Password"
          type="password"
          autoComplete="current-password"
          error={form.formState.errors.password?.message}
          {...form.register("password")}
        />
        <button className="button button--primary" type="submit" disabled={isSubmitting}>
          {isSubmitting ? "Signing in…" : "Sign in"}
        </button>
      </form>
    </section>
  );
}

function LoadingScreen() {
  return (
    <div className="loading-screen">
      <Brand />
      <span className="spinner" aria-label="Loading" />
    </div>
  );
}
''')

          Path('apps/dashboard/src/pages/AuthPage.css').write_text(r'''.auth-page--centered {
  position: relative;
  display: grid;
  min-height: 100vh;
  place-items: center;
  overflow: hidden;
  padding: 32px 20px;
  background-color: #d8dde2;
  background-position: center;
  background-size: cover;
}

.auth-page__shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(8, 14, 20, 0.18), rgba(8, 14, 20, 0.34));
}

.auth-page__content {
  position: relative;
  z-index: 1;
  width: min(430px, 100%);
}

.auth-page--centered .auth-card {
  width: 100%;
  padding: 34px 36px 36px;
  background: rgba(255, 255, 255, 0.97);
  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: 14px;
  box-shadow: 0 24px 70px rgba(4, 10, 16, 0.28);
  backdrop-filter: blur(14px);
}

.auth-page--centered .auth-card--setup {
  width: min(600px, calc(100vw - 40px));
  margin-left: 50%;
  transform: translateX(-50%);
}

.auth-studio-logo {
  display: block;
  width: 171px;
  height: auto;
  margin: 0 auto 30px;
  filter: brightness(0);
}

.auth-page--centered .auth-card header {
  margin-bottom: 26px;
  text-align: center;
}

.auth-page--centered .auth-card h1 {
  margin: 0 0 7px;
  color: #111820;
  font-size: 27px;
  font-weight: 680;
  letter-spacing: -0.035em;
}

.auth-page--centered .auth-card header p {
  margin: 0;
  color: #65707c;
  font-size: 14px;
}

.auth-page--centered .auth-card form {
  display: grid;
  gap: 18px;
}

.auth-page--centered .field input {
  height: 44px;
  padding-inline: 12px;
  border-radius: 7px;
}

.auth-page--centered .button--primary {
  min-height: 44px;
  margin-top: 4px;
  border-radius: 7px;
}

.auth-photo-credit {
  position: fixed;
  right: 18px;
  bottom: 14px;
  z-index: 1;
  color: rgba(255, 255, 255, 0.78);
  font-size: 11px;
  text-decoration: none;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
}

.auth-photo-credit:hover {
  color: white;
  text-decoration: underline;
}

@media (max-width: 620px) {
  .auth-page--centered {
    align-items: end;
    padding: 18px;
  }

  .auth-page--centered .auth-card,
  .auth-page--centered .auth-card--setup {
    width: 100%;
    margin: 0;
    padding: 28px 24px 30px;
    transform: none;
  }

  .auth-page--centered .form-grid {
    grid-template-columns: 1fr;
  }

  .auth-photo-credit {
    display: none;
  }
}
''')

