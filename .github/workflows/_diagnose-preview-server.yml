name: Diagnose preview server tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server-tests:
    if: github.head_ref == 'feature/live-screen-previews'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tilecast_test
          POSTGRES_USER: tilecast
          POSTGRES_PASSWORD: tilecast_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilecast -d tilecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Run complete server tests
        id: tests
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: postgres://tilecast:tilecast_test_password@localhost:5432/tilecast_test?sslmode=disable
        run: |
          set +e
          go test ./... 2>&1 | tee server-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete test log
        uses: actions/upload-artifact@v4
        with:
          name: preview-server-test-log
          path: apps/server/server-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
