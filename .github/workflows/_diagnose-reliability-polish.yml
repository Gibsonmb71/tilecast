name: Diagnose reliability polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-android-polish
          fetch-depth: 0
      - name: Capture dashboard checks
        working-directory: apps/dashboard
        run: |
          set +e
          npm ci > ../../dashboard-polish-diagnostic.txt 2>&1
          npm run format:check >> ../../dashboard-polish-diagnostic.txt 2>&1
          npm run lint >> ../../dashboard-polish-diagnostic.txt 2>&1
          npm test >> ../../dashboard-polish-diagnostic.txt 2>&1
          npm run build >> ../../dashboard-polish-diagnostic.txt 2>&1
          exit 0
      - name: Publish diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-polish-diagnostic.txt
          git commit -m 'Capture dashboard polish diagnostic'
          git push origin HEAD:audit/dashboard-android-polish
