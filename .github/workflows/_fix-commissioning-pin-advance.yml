name: Apply commissioning PIN advance fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/_fix-commissioning-pin-advance.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Advance after saving PIN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/player-android/app/src/main/java/org/tilecast/player/PlayerViewModel.kt')
          text = path.read_text()
          old = 'fun setCommissioningPin(pin:CharArray){commissioningController.setPin(pin);refreshCommissioning()}'
          new = 'fun setCommissioningPin(pin:CharArray){val screen=current?.screenId?:return;commissioningController.setPin(pin);commissioningController.advance(screen,CommissioningStep.ADMIN_PIN);refreshCommissioning()}'
          if old not in text:
              raise SystemExit('commissioning PIN handler marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/_fix-commissioning-pin-advance.yml
      - name: Verify Android player
        working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Advance commissioning after PIN setup'
          git push origin HEAD:main
