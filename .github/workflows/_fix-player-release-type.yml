name: Fix Player release API type

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/player-update-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-update-catalog
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add missing API type and verify dashboard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/dashboard/src/api/types.ts')
          text = path.read_text()
          old = '''export type PlayerReleaseList = {
            repository: string;
            lastCheckedAt?: string;
            providerError?: string;
            items: PlayerRelease[];
          };
          '''
          new = '''export type PlayerReleaseList = {
            repository: string;
            lastCheckedAt?: string;
            providerError?: string;
            manifestKeyConfigured: boolean;
            items: PlayerRelease[];
          };
          '''
          if old not in text:
              raise SystemExit('PlayerReleaseList marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/_fix-player-release-type.yml
          npm exec prettier -- --write apps/dashboard/src/api/types.ts
          npm run format:check --workspace @tilecast/dashboard
          npm run lint --workspace @tilecast/dashboard
          npm test --workspace @tilecast/dashboard
          npm run build --workspace @tilecast/dashboard
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Declare Player release manifest key status'
          git push origin HEAD:fix/player-update-catalog
