name: Format operations dashboard

on:
  push:
    branches: [feat/operations-dashboard]

permissions:
  contents: write

concurrency:
  group: format-operations-dashboard
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operations-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format dashboard files
        run: |
          set -euo pipefail
          npx prettier --write \
            apps/dashboard/src/pages/OperationsDashboard.tsx \
            apps/dashboard/src/pages/OperationsDashboard.css
          rm .github/workflows/_format-operations-dashboard.yml
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/pages/OperationsDashboard.tsx \
            apps/dashboard/src/pages/OperationsDashboard.css \
            .github/workflows/_format-operations-dashboard.yml
          git commit -m "Format operations dashboard"
          git push origin HEAD:feat/operations-dashboard
