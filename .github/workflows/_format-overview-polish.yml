name: Format Overview polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/overview-layout-light-theme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overview-layout-light-theme
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix markup, format, and clean up
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/dashboard/src/pages/OperationsDashboard.tsx')
          text = path.read_text()
          old = '''          ) : null}
        </div>

      <section className="ops-card ops-upcoming">'''
          new = '''          ) : null}

          <section className="ops-card ops-upcoming">'''
          if old not in text:
              raise SystemExit('Overview main-column marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npm exec prettier -- --write \
            apps/dashboard/src/pages/OperationsDashboard.tsx \
            apps/dashboard/src/pages/OperationsDashboard.css \
            apps/dashboard/src/pages/OperationsDashboard.test.ts
          rm .github/workflows/_format-overview-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix and format Overview polish'
          git push origin HEAD:fix/overview-layout-light-theme
