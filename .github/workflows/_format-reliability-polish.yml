name: Format reliability polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-android-polish
          fetch-depth: 0
      - run: |
          npm ci
          npm run format
          rm .github/workflows/_format-reliability-polish.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format reliability page polish'
          git push origin HEAD:audit/dashboard-android-polish
