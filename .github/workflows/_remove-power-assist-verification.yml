name: Remove Power Assist verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/dashboard-android-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-android-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove verification UI and verify dashboard
        run: |
          python3 scripts/remove-power-assist-verification.py
          rm scripts/remove-power-assist-verification.py .github/workflows/_remove-power-assist-verification.yml
          npm exec prettier -- --write apps/dashboard/src/pages/ScreensPage.tsx
          npm run format:check --workspace @tilecast/dashboard
          npm run lint --workspace @tilecast/dashboard
          npm test --workspace @tilecast/dashboard
          npm run build --workspace @tilecast/dashboard
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Power Assist verification'
          git push origin HEAD:audit/dashboard-android-polish
