name: Run login redesign helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/login-background'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/login-background
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: npm ci
      - name: Run implementation helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/_build-login-redesign.yml').read_text().splitlines()
          marker = '      - name: Implement configurable centered login'
          start = text.index(marker)
          run_line = next(i for i in range(start + 1, len(text)) if text[i] == '        run: |')
          body = []
          for line in text[run_line + 1:]:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')
          Path('/tmp/apply-login-redesign.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/apply-login-redesign.sh
