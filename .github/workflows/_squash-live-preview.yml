name: Squash live preview implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  squash:
    if: github.head_ref == 'feature/live-screen-previews'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-screen-previews
          fetch-depth: 0
      - name: Replace feature history with one reviewed commit
        run: |
          git fetch origin main
          rm .github/workflows/_squash-live-preview.yml
          git reset --soft origin/main
          git add -A
          git config user.name "Gibsonmb71"
          git config user.email "gibsonmb71@gmail.com"
          git commit -m "Add on-demand player live previews"
          git push --force-with-lease origin HEAD:feature/live-screen-previews
