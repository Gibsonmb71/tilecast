name: Verify Player 0.11.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_verify-player-0.11.0.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TAG: player-v0.11.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for signed release and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 120); do
            runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/player-release.yml/runs?event=workflow_dispatch&per_page=20")"
            run_id="$(printf '%s' "$runs" | jq -r --arg tag "$TAG" '.workflow_runs[] | select(.head_branch == $tag) | .id' | sed -n '1p')"
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              status="$(printf '%s' "$runs" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status')"
              conclusion="$(printf '%s' "$runs" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion')"
              echo "Player release run $run_id: $status / $conclusion"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                success=1
                break
              fi
            fi
            sleep 5
          done
          test "$success" -eq 1

          release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,url,assets)"
          test "$(printf '%s' "$release" | jq -r .tagName)" = "$TAG"
          for asset in tilecast-player.apk tilecast-player-update.json tilecast-player-update.json.sig; do
            printf '%s' "$release" | jq -e --arg asset "$asset" '.assets[] | select(.name == $asset)' >/dev/null
          done
          printf '%s' "$release" | jq .

      - name: Remove one-time verifier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_verify-player-0.11.0.yml
          git commit -m 'Remove Player 0.11.0 release verifier'
          git push origin HEAD:main
