name: Activity verification

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "apps/player-android/**"
      - "apps/dashboard/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/activity-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tilecast_test
          POSTGRES_USER: tilecast
          POSTGRES_PASSWORD: tilecast_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilecast -d tilecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Capture server verification
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: postgres://tilecast:tilecast_test_password@localhost:5432/tilecast_test?sslmode=disable
        run: |
          set +e
          go vet ./... > "$RUNNER_TEMP/server-vet.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/server-vet.status"
          go test ./... -count=1 -v > "$RUNNER_TEMP/server-test.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/server-test.status"
          go build ./cmd/tilecast > "$RUNNER_TEMP/server-build.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/server-build.status"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-server-verification
          path: ${{ runner.temp }}/server-*
          retention-days: 1

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Capture Android verification
        working-directory: apps/player-android
        run: |
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace > "$RUNNER_TEMP/android.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/android.status"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-android-verification
          path: ${{ runner.temp }}/android.*
          retention-days: 1

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and capture dashboard verification
        run: |
          set +e
          npm run format > "$RUNNER_TEMP/dashboard-format.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/dashboard-format.status"
          git diff -- apps/dashboard/src > "$RUNNER_TEMP/dashboard-format.patch"
          tar -czf "$RUNNER_TEMP/dashboard-formatted-src.tgz" apps/dashboard/src
          npm run lint > "$RUNNER_TEMP/dashboard-lint.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/dashboard-lint.status"
          npm test > "$RUNNER_TEMP/dashboard-test.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/dashboard-test.status"
          npm run build > "$RUNNER_TEMP/dashboard-build.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/dashboard-build.status"
          git diff --check > "$RUNNER_TEMP/dashboard-diff-check.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/dashboard-diff-check.status"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-dashboard-verification
          path: ${{ runner.temp }}/dashboard-*
          retention-days: 1
