name: Apply editorial review fixes

on:
  push:
    branches:
      - gibby/fix-editorial-major-review
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gibby/fix-editorial-major-review

      - name: Install dashboard dependencies
        run: npm ci

      - name: Apply review fixes
        run: |
          cat .github/fix-parts/part-* > /tmp/apply_editorial_review_fixes.py
          python /tmp/apply_editorial_review_fixes.py
          gofmt -w \
            apps/server/internal/settings/service.go \
            apps/server/internal/settings/registry_test.go \
            apps/server/internal/campaigns/service.go \
            apps/server/internal/httpapi/content_reviews.go \
            apps/server/internal/httpapi/routes.go \
            apps/server/internal/layouts/service.go \
            apps/server/internal/playlists/drafts.go \
            apps/server/internal/approvals/approvals.go \
            apps/server/internal/playlists/editorial_workflow_integration_test.go
          npx prettier --write \
            apps/dashboard/src/pages/CampaignsPage.tsx \
            apps/dashboard/src/api/types.ts \
            docs/openapi.yaml \
            docs/content-review.md

      - name: Validate changed areas
        run: |
          npm run format:check
          npm run lint --workspace @tilecast/dashboard
          npm test --workspace @tilecast/dashboard
          cd apps/server
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Commit fixes and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-editorial-review-fixes.yml .github/fix-parts/part-*
          git add apps docs
          git diff --cached --stat
          git commit -m "fix: address editorial workflow review findings"
          git push origin HEAD:gibby/fix-editorial-major-review
