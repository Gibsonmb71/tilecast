name: Apply Layout preview fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lunch-menu-workflow
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Extract and apply preview patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/one-shot-layout-preview.yml').read_text()
          start = workflow.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          Path('/tmp/apply-layout-preview.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          python3 /tmp/apply-layout-preview.py

      - name: Install and verify Studio
        run: |
          npm ci
          npx prettier --write apps/dashboard/src/pages/LayoutEditorPage.tsx apps/dashboard/src/content/SourceEditors.tsx
          cd apps/dashboard
          npm run lint
          npm test -- --run
          npm run build
          cd ../..
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/pages/LayoutEditorPage.tsx apps/dashboard/src/content/SourceEditors.tsx
          git commit -m "Load real lunch data in Layout previews"
          git push origin HEAD:fix/lunch-menu-workflow
