# One-use workflow on an isolated branch; it does not enter PR #290.
name: Apply PR 290 location summary fix

on:
  push:
    branches:
      - automation/pr290-location-summary

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/screens-media-ui-polish
          fetch-depth: 0
      - name: Apply asserted source replacement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/dashboard/src/pages/ScreensPage.tsx")
          source = path.read_text()

          replacements = [
              (
                  '''      <ScreenSummary
                  screens={screens}
                  status={status}
                  groupBy={groupBy}
                  onStatus={setStatus}
                  onGroupByLocation={() =>
                    setGroupBy(groupBy === "location" ? "none" : "location")
                  }
                />''',
                  '''      <ScreenSummary
                  screens={screens}
                  status={status}
                  onStatus={setStatus}
                />''',
              ),
              (
                  '''function ScreenSummary({
                  screens,
                  status,
                  groupBy,
                  onStatus,
                  onGroupByLocation,
                }: {
                  screens: Screen[];
                  status: string;
                  groupBy: string;
                  onStatus: (value: string) => void;
                  onGroupByLocation: () => void;
                }) {''',
                  '''function ScreenSummary({
                  screens,
                  status,
                  onStatus,
                }: {
                  screens: Screen[];
                  status: string;
                  onStatus: (value: string) => void;
                }) {''',
              ),
              (
                  '''      <button
                  className="summary-bar__item"
                  type="button"
                  aria-pressed={groupBy === "location"}
                  onClick={onGroupByLocation}
                >
                  <strong>{locations}</strong>{" "}
                  <span>Location{locations === 1 ? "" : "s"}</span>
                </button>''',
                  '''      <div className="summary-bar__item">
                  <strong>{locations}</strong>{" "}
                  <span>Location{locations === 1 ? "" : "s"}</span>
                </div>''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one exact match, found {count}: {old[:60]!r}")
              source = source.replace(old, new)

          path.write_text(source)
          PY
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/pages/ScreensPage.tsx
          git commit -m "fix: render location summary as static metric"
          git push origin HEAD:fix/screens-media-ui-polish
