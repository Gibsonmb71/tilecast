name: Apply timezone fix on pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tilecast_test
          POSTGRES_USER: tilecast
          POSTGRES_PASSWORD: tilecast_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilecast -d tilecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Extract and apply source patch
        shell: bash
        run: |
          sed -n '44,463p' .github/workflows/apply-timezone-local-time-fix.yml \
            | sed 's/^          //' > /tmp/apply-timezone-fix.py
          python <<'PATCH'
          from pathlib import Path

          path = Path('/tmp/apply-timezone-fix.py')
          text = path.read_text()
          old = '''def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))
          '''
          new = '''def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  if path.endswith("PlayerPolicyEditor.tsx") and "const save = useMutation" in old:
                      start = text.index("  const save = useMutation({")
                      end = text.index("    onSuccess: async () => {", start)
                      file.write_text(text[:start] + new + text[end:])
                      return
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))
          '''
          if text.count(old) != 1:
              raise SystemExit('could not patch extracted replace helper')
          path.write_text(text.replace(old, new, 1))
          PATCH
          { python -m py_compile /tmp/apply-timezone-fix.py && python /tmp/apply-timezone-fix.py; } > /tmp/apply-timezone-fix.log 2>&1
          git restore .github/workflows/apply-timezone-local-time-fix.yml
      - name: Upload patch failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timezone-patch-failure
          path: /tmp/apply-timezone-fix.log
      - run: npm ci
      - name: Format dashboard files
        run: npx prettier --write apps/dashboard/src/settings/settingValues.ts apps/dashboard/src/settings/SettingControl.tsx apps/dashboard/src/settings/PlayerPolicyEditor.tsx apps/dashboard/src/settings/settingsExperience.test.tsx apps/dashboard/src/pages/SettingsPage.tsx apps/dashboard/src/schedules/ScheduleBuilder.tsx
      - name: Format server files
        run: gofmt -w apps/server/internal/settings/registry.go apps/server/internal/settings/registry_test.go apps/server/internal/settings/service_integration_test.go
      - name: Dashboard validation
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Server validation
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: postgres://tilecast:tilecast_test_password@localhost:5432/tilecast_test?sslmode=disable
        run: |
          go vet ./...
          go test -p 1 ./...
          go build ./cmd/tilecast
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard apps/server
          git commit -m "Fix timezone and local-time settings handling"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
