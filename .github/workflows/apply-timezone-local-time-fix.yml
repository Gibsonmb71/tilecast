name: Apply timezone and local time fix

on:
  push:
    branches: [gibby/fix-timezone-local-time]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tilecast_test
          POSTGRES_USER: tilecast
          POSTGRES_PASSWORD: tilecast_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilecast -d tilecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gibby/fix-timezone-local-time
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Apply source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          Path("apps/dashboard/src/settings/settingValues.ts").write_text('''import type { SettingDefinition } from "../api/types";

const legacyTimezoneAliases: Record<string, string> = {
  EST: "America/New_York",
  EDT: "America/New_York",
  CST: "America/Chicago",
  CDT: "America/Chicago",
  MST: "America/Denver",
  MDT: "America/Denver",
  PST: "America/Los_Angeles",
  PDT: "America/Los_Angeles",
};

const localTimePattern = /^(?:[01]\\d|2[0-3]):[0-5]\\d(?::00)?$/;

export function normalizeLocalTime(value: unknown) {
  if (typeof value !== "string") return "";
  const trimmed = value.trim();
  return localTimePattern.test(trimmed) ? trimmed.slice(0, 5) : trimmed;
}

export function normalizeTimezone(value: unknown) {
  if (typeof value !== "string") return "";
  const trimmed = value.trim();
  return legacyTimezoneAliases[trimmed] ?? trimmed;
}

export function normalizeSettingValues(
  values: Record<string, unknown>,
  definitions: SettingDefinition[],
) {
  const normalized = { ...values };
  for (const definition of definitions) {
    if (!Object.hasOwn(normalized, definition.key)) continue;
    if (definition.type === "local_time")
      normalized[definition.key] = normalizeLocalTime(normalized[definition.key]);
    if (definition.type === "timezone")
      normalized[definition.key] = normalizeTimezone(normalized[definition.key]);
  }
  return normalized;
}

export function timezoneOptions(current: unknown) {
  const supported = (
    Intl as typeof Intl & { supportedValuesOf?: (key: "timeZone") => string[] }
  ).supportedValuesOf?.("timeZone");
  const zones = new Set([
    "UTC",
    "America/New_York",
    "America/Chicago",
    "America/Denver",
    "America/Los_Angeles",
    "Europe/London",
    ...(supported ?? []),
  ]);
  const normalizedCurrent = normalizeTimezone(current);
  if (
    normalizedCurrent === "UTC" ||
    (normalizedCurrent.includes("/") && normalizedCurrent.length < 200)
  )
    zones.add(normalizedCurrent);
  return [...zones].sort((left, right) =>
    timezoneLabel(left).localeCompare(timezoneLabel(right)),
  );
}

export function timezoneLabel(zone: string) {
  const common: Record<string, string> = {
    "America/New_York": "Eastern Time",
    "America/Chicago": "Central Time",
    "America/Denver": "Mountain Time",
    "America/Los_Angeles": "Pacific Time",
  };
  if (zone === "UTC") return "UTC";
  const friendly = common[zone];
  if (friendly) return `${friendly} (${zone})`;
  return zone.replaceAll("_", " ").replace("/", " — ");
}
''')

