name: Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-dashboard.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
