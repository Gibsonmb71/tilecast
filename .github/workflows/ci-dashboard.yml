name: Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-dashboard.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  release-player-0-14-5:
    if: github.event_name == 'pull_request' && github.head_ref == 'gibby/run-player-0.14.5-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag main and dispatch signed Player release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: player-v0.14.5
        run: |
          set -euo pipefail
          git fetch origin main --tags
          target="$(git rev-parse origin/main)"
          git show "$target:apps/player-android/app/build.gradle.kts" | grep -F 'versionCode = 29'
          git show "$target:apps/player-android/app/build.gradle.kts" | grep -F 'versionName = "0.14.5"'

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to move it." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$target" -m "Tilecast Player 0.14.5"
          git push origin "$RELEASE_TAG"

          gh workflow run player-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f channel=stable \
            -f release_notes=$'## What’s new\n\n- Adds outside-active-hours choices for a bouncing Tilecast logo, custom text, or a completely black screen.\n- Keeps Fire TV devices awake outside active hours and blocks sleep requests that could leave them unreachable.\n- Includes recent player reliability and settings compatibility fixes.'

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
