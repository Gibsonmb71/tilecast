name: Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-dashboard.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  verify-player-0-14-5:
    if: github.event_name == 'pull_request' && github.head_ref == 'gibby/run-player-0.14.5-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Watch signed Player release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: player-v0.14.5
        run: |
          set -euo pipefail
          git fetch origin main --tags
          target="$(git rev-parse origin/main)"
          tagged="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$tagged" = "$target"
          git show "$tagged:apps/player-android/app/build.gradle.kts" | grep -F 'versionCode = 29'
          git show "$tagged:apps/player-android/app/build.gradle.kts" | grep -F 'versionName = "0.14.5"'

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow player-release.yml \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "Watching Player Release run $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          names="$(printf '%s' "$release_json" | jq -r '.assets[].name')"
          grep -qx 'tilecast-player.apk' <<<"$names"
          grep -qx 'tilecast-player-update.json' <<<"$names"
          grep -qx 'tilecast-player-update.json.sig' <<<"$names"
          test "$(printf '%s' "$release_json" | jq -r .tagName)" = "$RELEASE_TAG"
          test "$(printf '%s' "$release_json" | jq -r .isDraft)" = "false"
          test "$(printf '%s' "$release_json" | jq -r .isPrerelease)" = "false"
          echo "Tilecast Player 0.14.5 release assets verified."

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
