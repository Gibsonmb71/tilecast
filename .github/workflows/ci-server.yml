name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - ".github/workflows/ci-server.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - ".github/workflows/ci-server.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tilecast_test
          POSTGRES_USER: tilecast
          POSTGRES_PASSWORD: tilecast_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilecast -d tilecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - working-directory: apps/server
        run: go vet ./...
      - working-directory: apps/server
        run: go test -p 1 ./...
        env:
          TEST_DATABASE_URL: postgres://tilecast:tilecast_test_password@localhost:5432/tilecast_test?sslmode=disable
      - working-directory: apps/server
        run: go build ./cmd/tilecast
