name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tilecast_test
          POSTGRES_USER: tilecast
          POSTGRES_PASSWORD: tilecast_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilecast -d tilecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          {
            go-version-file: apps/server/go.mod,
            cache-dependency-path: apps/server/go.sum,
          }
      - working-directory: apps/server
        run: go vet ./...
      - working-directory: apps/server
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://tilecast:tilecast_test_password@localhost:5432/tilecast_test?sslmode=disable
      - working-directory: apps/server
        run: go build ./cmd/tilecast
  android-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
