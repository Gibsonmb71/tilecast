name: Android CodeQL

on:
  push:
    branches: [main]
    paths:
      - "apps/player-android/**"
      - ".github/workflows/codeql-android.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for Android changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            apps/player-android \
            .github/workflows/codeql-android.yml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Android player
        working-directory: apps/player-android
        run: ./gradlew clean assembleDebug
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  unchanged:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record unaffected Android configuration
        run: |
          cat > unaffected.sarif <<'SARIF'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "CodeQL",
                    "version": "0.0.0",
                    "informationUri": "https://github.com/github/codeql-action",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          SARIF
      - name: Upload unaffected result
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: unaffected.sarif
          category: "/language:java-kotlin"
