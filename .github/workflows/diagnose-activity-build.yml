name: Diagnose Activity build

on:
  push:
    branches:
      - redesign-activity-proof-of-play

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign-activity-proof-of-play
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture dashboard build
        run: |
          npm run build > .github/activity-build.log 2>&1 || true
      - name: Commit build report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-activity-build.yml
          git add .github/activity-build.log
          git commit -m "Capture Activity build failure"
          git push origin HEAD:redesign-activity-proof-of-play
