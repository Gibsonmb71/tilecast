name: Fix merged dashboard build

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-merged-dashboard-build
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix strict schedule time parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/dashboard/src/pages/OperationsDashboard.tsx')
          text = path.read_text()
          old = '    const [hour, minute] = schedule.dailyStart.split(":").map(Number);'
          new = '    const [hour = 0, minute = 0] = schedule.dailyStart.split(":").map(Number);'
          if old not in text:
              raise SystemExit('Expected schedule time parsing line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm exec prettier -- --write apps/dashboard/src/pages/OperationsDashboard.tsx
      - run: npm run format:check
      - run: npm run build --workspace @tilecast/dashboard
      - name: Remove helper workflow
        run: rm .github/workflows/fix-dashboard-time-main.yml
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/dashboard/src/pages/OperationsDashboard.tsx .github/workflows/fix-dashboard-time-main.yml
          git commit -m "Fix dashboard schedule time parsing"
          git push origin HEAD:main
