name: Format dashboard refinement

on:
  push:
    branches: [feat/operations-console-refinement]

permissions:
  contents: write

concurrency:
  group: format-dashboard-refinement
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operations-console-refinement
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec prettier -- --write apps/dashboard/src/pages/OperationsDashboard.tsx
      - run: npm run format:check
      - run: npm run build --workspace @tilecast/dashboard
      - name: Remove helper workflow
        run: rm .github/workflows/format-dashboard-refinement.yml
      - name: Commit verified formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/dashboard/src/pages/OperationsDashboard.tsx .github/workflows/format-dashboard-refinement.yml
          git commit -m "Format operations dashboard refinement"
          git push origin HEAD:feat/operations-console-refinement
