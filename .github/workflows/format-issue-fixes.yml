name: Format issue fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-issue-fixes
          path: |
            apps/dashboard/src/App.tsx
            apps/dashboard/src/main.tsx
            apps/dashboard/src/components/AssetFilterPortal.tsx
            apps/dashboard/src/components/LayoutThumbnail.tsx
            apps/dashboard/src/pages/LayoutsPage.tsx
            apps/dashboard/src/pages/UsersPage.tsx
            apps/dashboard/src/styles/issues-37-45.css
