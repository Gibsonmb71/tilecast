name: Format Linux documentation

on:
  push:
    branches:
      - docs/linux-wiki
    paths:
      - README.md
      - wiki/**
      - .github/workflows/sync-wiki.yml
      - .github/workflows/format-linux-docs.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/linux-wiki

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Format changed documentation
        run: >-
          npx prettier --write
          README.md
          wiki/*.md
          .github/workflows/sync-wiki.yml
          .github/workflows/format-linux-docs.yml

      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md wiki .github/workflows/sync-wiki.yml .github/workflows/format-linux-docs.yml
          if git diff --cached --quiet; then
            echo "Documentation is already formatted."
            exit 0
          fi
          git commit -m "style: format Linux documentation"
          git push origin HEAD:docs/linux-wiki
