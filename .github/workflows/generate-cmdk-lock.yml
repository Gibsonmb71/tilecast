name: Generate cmdk lockfile

on:
  push:
    branches:
      - feature/cmdk-universal-search

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cmdk-universal-search
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-cmdk-lock.yml
          git add package-lock.json
          git commit -m "Add cmdk dependency lockfile"
          git push
