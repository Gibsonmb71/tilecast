name: Apply lunch menu fixes on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'fix/lunch-menu-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lunch-menu-workflow
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract and run the one-shot patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/one-shot-lunch-menu-fix.yml').read_text()
          start = workflow.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-lunch-menu-fix.py').write_text(script)
          PY
          python3 /tmp/apply-lunch-menu-fix.py

      - name: Format and install
        run: |
          gofmt -w apps/server/internal/media/structured_sources.go apps/server/internal/media/structured_sources_test.go
          npm ci
          npx prettier --write apps/dashboard/src/content/SourceEditors.tsx

      - name: Verify server
        working-directory: apps/server
        run: |
          go test ./internal/media
          go vet ./internal/media

      - name: Verify Studio
        working-directory: apps/dashboard
        run: |
          npm run lint
          npm test -- --run
          npm run build

      - name: Verify Android
        working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Commit fixes
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/internal/media/structured_sources.go \
            apps/server/internal/media/structured_sources_test.go \
            apps/dashboard/src/content/SourceEditors.tsx \
            apps/player-android/app/src/main/java/org/tilecast/player/content/NativeWidgetPlayback.kt \
            apps/player-android/app/src/test/java/org/tilecast/player/content/MenuWidgetTest.kt
          git commit -m "Fix lunch menu data and rendering"
          git push origin HEAD:fix/lunch-menu-workflow
