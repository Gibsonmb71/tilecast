name: One-shot lunch menu fixes

on:
  push:
    branches:
      - fix/lunch-menu-workflow

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Remove one-shot lunch menu workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lunch-menu-workflow
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply lunch menu fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          # CSV/JSON Data Sources should not require an artificial title field.
          replace_once(
              "apps/server/internal/media/structured_sources.go",
              '''\tif m.Title == "" {\n\t\treturn errors.New("source title mapping is required")\n\t}\n''',
              '''\tif m.Title == "" && m.Subtitle == "" && m.Date == "" && len(m.ValueFields) == 0 {\n\t\treturn errors.New("source mapping must include at least one display or value field")\n\t}\n''',
          )
          replace_once(
              "apps/server/internal/media/structured_sources.go",
              '''\t\ttitle := sanitizeCalendarText(value(c.Mapping.Title), 240)\n\t\trecords = append(records, StructuredRecord{ID: stableRecordID(fmt.Sprintf("%d:%s", index, title)), Title: title, Subtitle: sanitizeCalendarText(value(c.Mapping.Subtitle), 240), Date: normalizeStructuredDate(value(c.Mapping.Date), c.DateSelection), ImageURL: safeRemoteRecordURL(value(c.Mapping.ImageURL)), Link: safeRemoteRecordURL(value(c.Mapping.Link)), Values: values})\n''',
              '''\t\ttitle := sanitizeCalendarText(value(c.Mapping.Title), 240)\n\t\tsubtitle := sanitizeCalendarText(value(c.Mapping.Subtitle), 240)\n\t\tdate := normalizeStructuredDate(value(c.Mapping.Date), c.DateSelection)\n\t\tidentity := structuredRecordIdentity(title, subtitle, date, values)\n\t\trecords = append(records, StructuredRecord{ID: stableRecordID(fmt.Sprintf("%d:%s", index, identity)), Title: title, Subtitle: subtitle, Date: date, ImageURL: safeRemoteRecordURL(value(c.Mapping.ImageURL)), Link: safeRemoteRecordURL(value(c.Mapping.Link)), Values: values})\n''',
          )
          replace_once(
              "apps/server/internal/media/structured_sources.go",
              '''\t\ttitle, err := field(row, c.Mapping.Title)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\trecords = append(records, StructuredRecord{ID: stableRecordID(fmt.Sprintf("%d:%s", index, title)), Title: sanitizeCalendarText(title, 240), Subtitle: sanitizeCalendarText(value(c.Mapping.Subtitle), 240), Date: normalizeStructuredDate(value(c.Mapping.Date), c.DateSelection), ImageURL: safeRemoteRecordURL(value(c.Mapping.ImageURL)), Link: safeRemoteRecordURL(value(c.Mapping.Link)), Values: values})\n''',
              '''\t\ttitle := sanitizeCalendarText(value(c.Mapping.Title), 240)\n\t\tsubtitle := sanitizeCalendarText(value(c.Mapping.Subtitle), 240)\n\t\tdate := normalizeStructuredDate(value(c.Mapping.Date), c.DateSelection)\n\t\tidentity := structuredRecordIdentity(title, subtitle, date, values)\n\t\trecords = append(records, StructuredRecord{ID: stableRecordID(fmt.Sprintf("%d:%s", index, identity)), Title: title, Subtitle: subtitle, Date: date, ImageURL: safeRemoteRecordURL(value(c.Mapping.ImageURL)), Link: safeRemoteRecordURL(value(c.Mapping.Link)), Values: values})\n''',
          )
          replace_once(
              "apps/server/internal/media/structured_sources.go",
              '''func mapValues(values map[string]string) []string {\n''',
              '''func structuredRecordIdentity(title, subtitle, date string, values map[string]string) string {\n\tif identity := firstNonempty(title, subtitle, date); identity != "" {\n\t\treturn identity\n\t}\n\tkeys := make([]string, 0, len(values))\n\tfor key := range values {\n\t\tkeys = append(keys, key)\n\t}\n\tsort.Strings(keys)\n\tfor _, key := range keys {\n\t\tif value := strings.TrimSpace(values[key]); value != "" {\n\t\t\treturn key + ":" + value\n\t\t}\n\t}\n\treturn "record"\n}\n\nfunc mapValues(values map[string]string) []string {\n''',
          )

          test_file = Path("apps/server/internal/media/structured_sources_test.go")
          test_text = test_file.read_text()
          if "TestStructuredSourceParsersAllowDataOnlyMappings" not in test_text:
              test_text += '''\nfunc TestStructuredSourceParsersAllowDataOnlyMappings(t *testing.T) {\n\tmapping := StructuredMapping{Date: "date", ValueFields: map[string]string{"option_1": "option_1", "option_2": "option_2"}}\n\tif err := validateStructuredMapping(mapping, "csv"); err != nil {\n\t\tt.Fatalf("data-only mapping rejected: %v", err)\n\t}\n\tconfig := StructuredSourceConfig{MaxItems: 10, Sort: "source", Mapping: &mapping, DateSelection: DateSelection{Enabled: true, DateFormat: "iso_date", Timezone: "America/New_York", Mode: "today", NoMatchBehavior: "empty"}}\n\trecords, err := parseCSVRecords([]byte("date,option_1,option_2\\n2026-08-03,Chicken tenders,Cheeseburger\\n"), config)\n\tif err != nil || len(records) != 1 {\n\t\tt.Fatalf("records=%#v err=%v", records, err)\n\t}\n\tif records[0].Title != "" || records[0].Values["option_1"] != "Chicken tenders" || records[0].Values["option_2"] != "Cheeseburger" {\n\t\tt.Fatalf("unexpected data-only record: %#v", records[0])\n\t}\n}\n'''
              test_file.write_text(test_text)

          # Give Menu its own native presentation instead of sharing the generic list renderer.
          native = Path("apps/player-android/app/src/main/java/org/tilecast/player/content/NativeWidgetPlayback.kt")
          text = native.read_text()
          old_branch = '''        "menu", "list", "table", "agenda" -> runCatching { Json.decodeFromJsonElement<DisplayWidgetConfig>(widget.configuration) }.onSuccess { config ->\n            val data = session.content.manifest.dataSources.firstOrNull { it.id == config.dataSourceId } ?: return@onSuccess onFailure("Widget data is unavailable")\n            when (data.provider) {\n                "calendar" -> runCatching { Json.decodeFromJsonElement<org.tilecast.player.network.CalendarSourceConfig>(data.configuration) }.onSuccess { DisplayCalendarWidget(config, it) }.onFailure { onFailure("Agenda data is invalid") }\n                else -> runCatching { Json.decodeFromJsonElement<StructuredSourceConfig>(data.configuration) }.onSuccess { DisplayStructuredWidget(config, it) }.onFailure { onFailure("Widget data is invalid") }\n            }\n        }.onFailure { onFailure("Widget configuration is invalid") }\n'''
          new_branch = '''        "menu" -> runCatching { Json.decodeFromJsonElement<DisplayWidgetConfig>(widget.configuration) }.onSuccess { config ->\n            val data = session.content.manifest.dataSources.firstOrNull { it.id == config.dataSourceId } ?: return@onSuccess onFailure("Menu data is unavailable")\n            if (data.provider != "csv" && data.provider != "json") return@onSuccess onFailure("Menu data is incompatible")\n            runCatching { Json.decodeFromJsonElement<StructuredSourceConfig>(data.configuration) }\n                .onSuccess { MenuWidget(widget.name, config, it) }\n                .onFailure { onFailure("Menu data is invalid") }\n        }.onFailure { onFailure("Menu Widget configuration is invalid") }\n        "list", "table", "agenda" -> runCatching { Json.decodeFromJsonElement<DisplayWidgetConfig>(widget.configuration) }.onSuccess { config ->\n            val data = session.content.manifest.dataSources.firstOrNull { it.id == config.dataSourceId } ?: return@onSuccess onFailure("Widget data is unavailable")\n            when (data.provider) {\n                "calendar" -> runCatching { Json.decodeFromJsonElement<org.tilecast.player.network.CalendarSourceConfig>(data.configuration) }.onSuccess { DisplayCalendarWidget(config, it) }.onFailure { onFailure("Agenda data is invalid") }\n                else -> runCatching { Json.decodeFromJsonElement<StructuredSourceConfig>(data.configuration) }.onSuccess { DisplayStructuredWidget(config, it) }.onFailure { onFailure("Widget data is invalid") }\n            }\n        }.onFailure { onFailure("Widget configuration is invalid") }\n'''
          if old_branch not in text:
              raise SystemExit("Native Widget branch block was not found")
          text = text.replace(old_branch, new_branch, 1)

          old_ticker = '''        when (config.field) {\n            "title" -> record.title\n            "subtitle" -> record.subtitle\n            "date" -> record.date\n            "author" -> record.author\n            "description" -> record.description\n            else -> record.values[config.field]\n        }.takeIf { !it.isNullOrBlank() }\n'''
          new_ticker = '''        structuredFieldValue(record, config.field).takeIf { it.isNotBlank() }\n'''
          if old_ticker not in text:
              raise SystemExit("Ticker field resolver block was not found")
          text = text.replace(old_ticker, new_ticker, 1)

          old_display = '''@Composable private fun DisplayStructuredWidget(config: DisplayWidgetConfig, data: StructuredSourceConfig) { var now by remember { mutableStateOf(Instant.now()) }; LaunchedEffect(data.dateSelection.timezone) { while (true) { now = Instant.now(); delay(30_000) } }; val records = selectDateAwareRecords(data, now).take(config.maximumItems); Box(Modifier.fillMaxSize().background(parseColor(config.backgroundColor)).padding(36.dp)) { LazyColumn(verticalArrangement = Arrangement.spacedBy(14.dp)) { items(records, key = { it.id }) { record -> Text(config.fields.mapNotNull { field -> when(field) { "title" -> record.title; "subtitle" -> record.subtitle; "date" -> record.date; "author" -> record.author; "description" -> record.description; else -> record.values[field] }.takeIf { !it.isNullOrBlank() } }.joinToString("  "), color = parseColor(config.foregroundColor), fontSize = 26.sp) } } } }\n'''
          new_display = '''@Composable\nprivate fun MenuWidget(name: String, config: DisplayWidgetConfig, data: StructuredSourceConfig) {\n    var now by remember { mutableStateOf(Instant.now()) }\n    LaunchedEffect(data.dateSelection.timezone) {\n        while (true) {\n            now = Instant.now()\n            delay(30_000)\n        }\n    }\n    val record = selectDateAwareRecords(data, now).firstOrNull()\n    Box(Modifier.fillMaxSize().background(parseColor(config.backgroundColor)).padding(48.dp), contentAlignment = Alignment.Center) {\n        if (record == null) {\n            FittedWidgetText(data.emptyState, parseColor(config.foregroundColor), 42f, FontWeight.Medium, maxLines = 3)\n            return@Box\n        }\n        val values = config.fields.mapNotNull { field ->\n            structuredFieldValue(record, field).takeIf(String::isNotBlank)?.let { field to it }\n        }.take(config.maximumItems.coerceAtMost(8))\n        if (values.isEmpty()) {\n            FittedWidgetText(data.emptyState, parseColor(config.foregroundColor), 42f, FontWeight.Medium, maxLines = 3)\n            return@Box\n        }\n        Column(\n            modifier = Modifier.fillMaxSize(),\n            horizontalAlignment = Alignment.CenterHorizontally,\n            verticalArrangement = Arrangement.Center,\n        ) {\n            Text(name.uppercase(), color = parseColor(config.foregroundColor), fontSize = 24.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.Center)\n            if (record.date.isNotBlank()) Text(record.date, color = parseColor(config.foregroundColor).copy(alpha = 0.72f), fontSize = 18.sp, textAlign = TextAlign.Center)\n            values.forEachIndexed { index, (field, value) ->\n                Text(\n                    if (index == 0) "TODAY'S LUNCH" else menuFieldLabel(field).uppercase(),\n                    color = parseColor(config.foregroundColor).copy(alpha = 0.72f),\n                    fontSize = if (index == 0) 20.sp else 16.sp,\n                    fontWeight = FontWeight.SemiBold,\n                    textAlign = TextAlign.Center,\n                    modifier = Modifier.padding(top = if (index == 0) 28.dp else 22.dp),\n                )\n                Text(\n                    value,\n                    color = parseColor(config.foregroundColor),\n                    fontSize = if (index == 0) 52.sp else 34.sp,\n                    fontWeight = if (index == 0) FontWeight.Bold else FontWeight.Medium,\n                    textAlign = TextAlign.Center,\n                    maxLines = 3,\n                    overflow = TextOverflow.Ellipsis,\n                )\n            }\n        }\n    }\n}\n\n@Composable private fun DisplayStructuredWidget(config: DisplayWidgetConfig, data: StructuredSourceConfig) { var now by remember { mutableStateOf(Instant.now()) }; LaunchedEffect(data.dateSelection.timezone) { while (true) { now = Instant.now(); delay(30_000) } }; val records = selectDateAwareRecords(data, now).take(config.maximumItems); Box(Modifier.fillMaxSize().background(parseColor(config.backgroundColor)).padding(36.dp)) { LazyColumn(verticalArrangement = Arrangement.spacedBy(14.dp)) { items(records, key = { it.id }) { record -> Text(config.fields.mapNotNull { field -> structuredFieldValue(record, field).takeIf(String::isNotBlank) }.joinToString("  "), color = parseColor(config.foregroundColor), fontSize = 26.sp) } } } }\n\nprivate fun structuredFieldValue(record: org.tilecast.player.network.StructuredRecord, field: String): String = when (field) {\n    "title" -> record.title\n    "subtitle" -> record.subtitle\n    "date" -> record.date\n    "author" -> record.author\n    "description" -> record.description\n    else -> record.values[field].orEmpty()\n}\n\ninternal fun menuFieldLabel(field: String): String {\n    return when (field.lowercase()) {\n        "option_2", "alternative", "secondary", "secondary_option" -> "Alternative"\n        "option_1", "primary", "primary_option", "entree", "entrée" -> "Entrée"\n        else -> field.replace('_', ' ').replace('-', ' ').trim().split(Regex("\\\\s+")).filter(String::isNotBlank).joinToString(" ") { token -> token.replaceFirstChar { if (it.isLowerCase()) it.titlecase() else it.toString() } }\n    }\n}\n'''
          if old_display not in text:
              raise SystemExit("Generic structured renderer block was not found")
          native.write_text(text.replace(old_display, new_display, 1))

          menu_test = Path("apps/player-android/app/src/test/java/org/tilecast/player/content/MenuWidgetTest.kt")
          menu_test.write_text('''package org.tilecast.player.content\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\n\nclass MenuWidgetTest {\n    @Test fun humanizesCommonLunchFields() {\n        assertEquals("Entrée", menuFieldLabel("option_1"))\n        assertEquals("Alternative", menuFieldLabel("option_2"))\n        assertEquals("Side Dish", menuFieldLabel("side_dish"))\n    }\n}\n''')

          # Studio: use Data Source field schemas instead of free-form field names and finish the Widget rename.
          editor = Path("apps/dashboard/src/content/SourceEditors.tsx")
          text = editor.read_text()
          anchor = '''  const compatibleDataSources = (dataSources.data?.items ?? []).filter(\n    (source) => (acceptedProviders[provider] ?? []).includes(source.provider),\n  );\n  const save = useMutation({\n'''
          insertion = '''  const compatibleDataSources = (dataSources.data?.items ?? []).filter(\n    (source) => (acceptedProviders[provider] ?? []).includes(source.provider),\n  );\n  const selectedDataSourceId = ["ticker", "menu", "list", "table", "agenda"].includes(provider)\n    ? (configuration as TickerWidgetConfig | DisplayWidgetConfig).dataSourceId\n    : "";\n  const selectedDataSource = useQuery({\n    queryKey: ["widget-data-source", selectedDataSourceId],\n    queryFn: () => api.getDataSource(selectedDataSourceId),\n    enabled: Boolean(selectedDataSourceId),\n  });\n  const availableFields = selectedDataSource.data?.fields ?? [];\n  const save = useMutation({\n'''
          if anchor not in text:
              raise SystemExit("Widget Data Source query anchor was not found")
          text = text.replace(anchor, insertion, 1)
          text = text.replace('maximumItems: 20,\n      ...colors,', 'maximumItems: provider === "menu" ? 2 : 20,\n      ...colors,', 1)
          text = text.replace('<span className="field__label">Data App</span>', '<span className="field__label">Data Source</span>')

          ticker_field = '''                <label className="field">\n                  <span className="field__label">Field</span>\n                  <input\n                    value={(configuration as TickerWidgetConfig).field}\n                    disabled={readOnly}\n                    onChange={(e) =>\n                      setConfiguration((current) => ({\n                        ...current,\n                        field: e.target.value,\n                      }))\n                    }\n                  />\n                </label>\n'''
          ticker_select = '''                <label className="field">\n                  <span className="field__label">Field</span>\n                  <select\n                    value={(configuration as TickerWidgetConfig).field}\n                    disabled={readOnly || !availableFields.length}\n                    onChange={(e) =>\n                      setConfiguration((current) => ({\n                        ...current,\n                        field: e.target.value,\n                      }))\n                    }\n                  >\n                    {!availableFields.length && <option value="">Select a Data Source first</option>}\n                    {availableFields.map((field) => (\n                      <option key={field.key} value={field.key}>{field.label}</option>\n                    ))}\n                  </select>\n                </label>\n'''
          if ticker_field not in text:
              raise SystemExit("Ticker field input was not found")
          text = text.replace(ticker_field, ticker_select, 1)

          display_fields = '''              <label className="field">\n                <span className="field__label">Fields</span>\n                <input\n                  value={(configuration as DisplayWidgetConfig).fields.join(\n                    ", ",\n                  )}\n                  disabled={readOnly}\n                  onChange={(event) =>\n                    setConfiguration((current) => ({\n                      ...current,\n                      fields: event.target.value\n                        .split(",")\n                        .map((field) => field.trim())\n                        .filter(Boolean),\n                    }))\n                  }\n                />\n              </label>\n'''
          display_picker = '''              <fieldset>\n                <legend>Displayed fields</legend>\n                {!availableFields.length ? (\n                  <small>Select a Data Source to choose its fields.</small>\n                ) : (\n                  <div className="checkbox-grid">\n                    {availableFields.map((field) => {\n                      const selected = (configuration as DisplayWidgetConfig).fields.includes(field.key);\n                      return (\n                        <label key={field.key}>\n                          <input\n                            type="checkbox"\n                            checked={selected}\n                            disabled={readOnly}\n                            onChange={(event) =>\n                              setConfiguration((current) => {\n                                const config = current as DisplayWidgetConfig;\n                                const fields = event.target.checked\n                                  ? [...config.fields.filter((item) => item !== field.key), field.key]\n                                  : config.fields.filter((item) => item !== field.key);\n                                return { ...config, fields };\n                              })\n                            }\n                          />\n                          <span>{field.label}</span>\n                        </label>\n                      );\n                    })}\n                  </div>\n                )}\n              </fieldset>\n'''
          if display_fields not in text:
              raise SystemExit("Display Widget fields input was not found")
          text = text.replace(display_fields, display_picker, 1)

          replacements = {\n              '{provider[0]!.toUpperCase() + provider.slice(1)}{" "}\n              App': '{provider[0]!.toUpperCase() + provider.slice(1)}{" "}\n              Widget',\n              'Reusable native App configuration.': 'Reusable native Widget configuration.',\n              'Ticker preview uses the selected data App.': 'Preview uses the selected Data Source.',\n              'Save App': 'Save Widget',\n              'Create YouTube App': 'Create YouTube Widget',\n              'Edit YouTube App': 'Edit YouTube Widget',\n              'Discard unsaved YouTube App changes?': 'Discard unsaved YouTube Widget changes?',\n          }\n          for old, new in replacements.items():\n              text = text.replace(old, new)\n          editor.write_text(text)
          PY

      - name: Format
        run: |
          gofmt -w apps/server/internal/media/structured_sources.go apps/server/internal/media/structured_sources_test.go
          npx prettier --write apps/dashboard/src/content/SourceEditors.tsx

      - name: Install dashboard dependencies
        run: npm ci

      - name: Verify server
        working-directory: apps/server
        run: |
          go test ./internal/media
          go vet ./internal/media

      - name: Verify Studio
        working-directory: apps/dashboard
        run: |
          npm run lint
          npm test -- --run
          npm run build

      - name: Verify Android
        working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Check diff
        run: git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/internal/media/structured_sources.go \
            apps/server/internal/media/structured_sources_test.go \
            apps/dashboard/src/content/SourceEditors.tsx \
            apps/player-android/app/src/main/java/org/tilecast/player/content/NativeWidgetPlayback.kt \
            apps/player-android/app/src/test/java/org/tilecast/player/content/MenuWidgetTest.kt
          git commit -m "Fix lunch menu data and rendering"
          git push origin HEAD:fix/lunch-menu-workflow
