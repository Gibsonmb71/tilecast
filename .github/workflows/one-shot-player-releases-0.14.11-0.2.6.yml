name: One-shot Player Releases 0.14.11 and 0.2.6

on:
  push:
    branches:
      - release/players-0.14.11-0.2.6
    paths:
      - .github/workflows/one-shot-player-releases-0.14.11-0.2.6.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: one-shot-player-releases-0.14.11-0.2.6
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: release/players-0.14.11-0.2.6

      - name: Bump Android and Linux player versions
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          gradle_path = Path("apps/player-android/app/build.gradle.kts")
          gradle = gradle_path.read_text()
          old_android = '        versionCode = 34\n        versionName = "0.14.10"'
          new_android = '        versionCode = 35\n        versionName = "0.14.11"'
          if gradle.count(old_android) != 1:
              raise SystemExit("Expected Android 0.14.10/versionCode 34 exactly once")
          gradle_path.write_text(gradle.replace(old_android, new_android))

          package_path = Path("apps/player-linux/package.json")
          package = package_path.read_text()
          old_package = '  "version": "0.2.5",'
          new_package = '  "version": "0.2.6",'
          if package.count(old_package) != 1:
              raise SystemExit("Expected Linux package version 0.2.5 exactly once")
          package_path.write_text(package.replace(old_package, new_package))

          lock_path = Path("package-lock.json")
          lock_data = json.loads(lock_path.read_text())
          linux_package = lock_data.get("packages", {}).get("apps/player-linux")
          if not isinstance(linux_package, dict) or linux_package.get("version") != "0.2.5":
              raise SystemExit("Expected Linux lockfile package version 0.2.5")
          linux_package["version"] = "0.2.6"
          lock_path.write_text(json.dumps(lock_data, indent=2) + "\n")
          PY

      - name: Commit version bumps
        id: version_commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/player-android/app/build.gradle.kts apps/player-linux/package.json package-lock.json
          git commit -m "chore(players): release Android 0.14.11 and Linux 0.2.6"
          git push origin HEAD:release/players-0.14.11-0.2.6
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release tags
        run: |
          set -euo pipefail
          git fetch --tags --force
          for tag in player-v0.14.11 player-linux-v0.2.6; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists." >&2
              exit 1
            fi
          done
          git tag -a player-v0.14.11 -m "Tilecast Player for Android 0.14.11"
          git tag -a player-linux-v0.2.6 -m "Tilecast Player for Linux 0.2.6"
          git push origin refs/tags/player-v0.14.11 refs/tags/player-linux-v0.2.6

      - name: Dispatch and verify signed release workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            local tag="$2"
            local before_file
            before_file="$(mktemp)"

            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId \
              --jq '.[].databaseId' > "$before_file"

            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f "tag=$tag" \
              -f channel=stable

            local run_id=""
            for _ in $(seq 1 60); do
              while IFS= read -r candidate; do
                if [ -n "$candidate" ] && ! grep -qx "$candidate" "$before_file"; then
                  run_id="$candidate"
                  break
                fi
              done < <(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$workflow" \
                  --event workflow_dispatch \
                  --limit 30 \
                  --json databaseId \
                  --jq '.[].databaseId'
              )

              if [ -n "$run_id" ]; then
                break
              fi
              sleep 5
            done

            if [ -z "$run_id" ]; then
              echo "Could not find the dispatched run for $workflow." >&2
              exit 1
            fi

            echo "Watching $workflow run $run_id for $tag"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          }

          dispatch_and_wait player-release.yml player-v0.14.11
          dispatch_and_wait linux-player-release.yml player-linux-v0.2.6

      - name: Mark both releases complete
        run: |
          set -euo pipefail
          marker=players-release-0.14.11-0.2.6-complete
          if git rev-parse -q --verify "refs/tags/$marker" >/dev/null; then
            echo "Completion marker already exists." >&2
            exit 1
          fi
          git tag -a "$marker" -m "Android 0.14.11 and Linux 0.2.6 releases completed"
          git push origin "refs/tags/$marker"
