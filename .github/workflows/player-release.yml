name: Tilecast Player Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example player-v0.9.0
        required: true
      channel:
        description: stable or beta
        required: true
        default: stable
        type: choice
        options: [stable, beta]
      release_notes:
        description: Public release summary
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.TILECAST_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TILECAST_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TILECAST_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TILECAST_ANDROID_KEY_PASSWORD }}
          UPDATE_PRIVATE_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_PUBLIC_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_PEM }}
        run: test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$UPDATE_PRIVATE_KEY" && test -n "$UPDATE_PUBLIC_KEY"
      - name: Materialize ephemeral signing files
        env:
          KEYSTORE_B64: ${{ secrets.TILECAST_ANDROID_KEYSTORE_BASE64 }}
          UPDATE_PRIVATE_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_PUBLIC_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          mkdir -p "$RUNNER_TEMP/tilecast-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tilecast-signing/player.jks"
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/tilecast-signing/update-private.pem"
          printf '%s' "$UPDATE_PUBLIC_KEY" > "$RUNNER_TEMP/tilecast-signing/update-public.pem"
      - name: Reject a non-increasing version code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' apps/player-android/app/build.gradle.kts | head -1)
          previous=$(gh release list --limit 30 --json tagName --jq '.[].tagName' | while read -r tag; do gh release download "$tag" -p tilecast-player-update.json -D "$RUNNER_TEMP/previous-$tag" >/dev/null 2>&1 && jq -r .versionCode "$RUNNER_TEMP/previous-$tag/tilecast-player-update.json"; done | sort -nr | head -1)
          test -z "$previous" || test "$current" -gt "$previous"
      - name: Build, sign, verify, and create release assets
        env:
          TILECAST_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tilecast-signing/player.jks
          TILECAST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TILECAST_ANDROID_KEYSTORE_PASSWORD }}
          TILECAST_ANDROID_KEY_ALIAS: ${{ secrets.TILECAST_ANDROID_KEY_ALIAS }}
          TILECAST_ANDROID_KEY_PASSWORD: ${{ secrets.TILECAST_ANDROID_KEY_PASSWORD }}
          TILECAST_UPDATE_MANIFEST_PRIVATE_KEY: ${{ runner.temp }}/tilecast-signing/update-private.pem
          TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_FILE: ${{ runner.temp }}/tilecast-signing/update-public.pem
          TILECAST_RELEASE_CHANNEL: ${{ inputs.channel }}
          TILECAST_RELEASE_NOTES: ${{ inputs.release_notes }}
          TILECAST_RELEASE_OUTPUT: ${{ runner.temp }}/tilecast-player-release
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
        run: scripts/build-player-release.sh
      - name: Verify release metadata against APK
        run: |
          test "$(jq -r .apkSizeBytes "$RUNNER_TEMP/tilecast-player-release/tilecast-player-update.json")" = "$(wc -c < "$RUNNER_TEMP/tilecast-player-release/tilecast-player.apk" | tr -d ' ')"
          test "$(jq -r .apkSha256 "$RUNNER_TEMP/tilecast-player-release/tilecast-player-update.json")" = "$(sha256sum "$RUNNER_TEMP/tilecast-player-release/tilecast-player.apk" | awk '{print $1}')"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          prerelease=()
          if [ "$RELEASE_CHANNEL" = beta ]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/tilecast-player-release/tilecast-player.apk" "$RUNNER_TEMP/tilecast-player-release/tilecast-player-update.json" "$RUNNER_TEMP/tilecast-player-release/tilecast-player-update.json.sig" --title "Tilecast Player $RELEASE_TAG" --notes "$RELEASE_NOTES" "${prerelease[@]}"
