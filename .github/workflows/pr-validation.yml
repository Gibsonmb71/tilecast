name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
      linux: ${{ steps.paths.outputs.linux }}
      server: ${{ steps.paths.outputs.server }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      container: ${{ steps.paths.outputs.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          android=false
          linux=false
          server=false
          dashboard=false
          container=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            android=true
            linux=true
            server=true
            dashboard=true
            container=true
          else
            while IFS= read -r path; do
              case "$path" in
                apps/player-android/*|scripts/build-player-release.sh|scripts/extract-apksigner-sha256.sh)
                  android=true
                  ;;
                apps/player-linux/*|scripts/build-linux-player-release.sh|scripts/verify-linux-player-release.mjs)
                  linux=true
                  ;;
                apps/server/*)
                  server=true
                  container=true
                  ;;
                apps/dashboard/*|packages/*)
                  dashboard=true
                  container=true
                  ;;
                package.json|package-lock.json)
                  dashboard=true
                  linux=true
                  container=true
                  ;;
                deploy/docker/*)
                  container=true
                  ;;
                .github/workflows/*)
                  android=true
                  linux=true
                  server=true
                  dashboard=true
                  container=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          {
            echo "android=$android"
            echo "linux=$linux"
            echo "server=$server"
            echo "dashboard=$dashboard"
            echo "container=$container"
          } >> "$GITHUB_OUTPUT"

  apply_pr290_fix:
    name: Apply PR 290 source fix
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 290
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply asserted source replacement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/dashboard/src/pages/ScreensPage.tsx")
          source = path.read_text()

          call_anchor = "      <ScreenSummary\n"
          if source.count(call_anchor) != 1:
              raise SystemExit("Expected exactly one ScreenSummary call")
          call_start = source.index(call_anchor)
          call_end = source.index("      />", call_start) + len("      />")
          call = source[call_start:call_end]
          for marker in ("groupBy={groupBy}", "onGroupByLocation", "setGroupBy("):
              if marker not in call:
                  raise SystemExit(f"ScreenSummary call is missing {marker}")
          source = (
              source[:call_start]
              + '''      <ScreenSummary
                screens={screens}
                status={status}
                onStatus={setStatus}
              />'''
              + source[call_end:]
          )

          signature_anchor = "function ScreenSummary({"
          if source.count(signature_anchor) != 1:
              raise SystemExit("Expected exactly one ScreenSummary declaration")
          signature_start = source.index(signature_anchor)
          signature_end = source.index("}) {", signature_start) + len("}) {")
          signature = source[signature_start:signature_end]
          for marker in ("groupBy", "onGroupByLocation"):
              if marker not in signature:
                  raise SystemExit(f"ScreenSummary signature is missing {marker}")
          source = (
              source[:signature_start]
              + '''function ScreenSummary({
                screens,
                status,
                onStatus,
              }: {
                screens: Screen[];
                status: string;
                onStatus: (value: string) => void;
              }) {'''
              + source[signature_end:]
          )

          pressed_anchor = 'aria-pressed={groupBy === "location"}'
          if source.count(pressed_anchor) != 1:
              raise SystemExit("Expected exactly one interactive Location summary")
          pressed = source.index(pressed_anchor)
          metric_start = source.rfind("      <button", 0, pressed)
          metric_end = source.index("      </button>", pressed) + len("      </button>")
          metric = source[metric_start:metric_end]
          if "onClick={onGroupByLocation}" not in metric or "{locations}" not in metric:
              raise SystemExit("Location summary button boundaries were not verified")
          source = (
              source[:metric_start]
              + '''      <div className="summary-bar__item">
                <strong>{locations}</strong>{" "}
                <span>Location{locations === 1 ? "" : "s"}</span>
              </div>'''
              + source[metric_end:]
          )

          path.write_text(source)
          PY
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/pages/ScreensPage.tsx
          git commit -m "fix: render location summary as static metric"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  android_ci:
    name: Android CI
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Test, lint, and assemble
        working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Test Reporter
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Android tests
          path: apps/player-android/app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-empty: false

  linux_player_ci:
    name: Linux Player release contract
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run player:linux:test
      - run: npm run player:linux:build
      - name: Create test-only release signing keys
        run: |
          set -euo pipefail
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/linux-update-private.pem"
          openssl pkey \
            -in "$RUNNER_TEMP/linux-update-private.pem" \
            -pubout \
            -out "$RUNNER_TEMP/linux-update-public.pem"
      - name: Build and validate packaged release
        env:
          TILECAST_UPDATE_MANIFEST_PRIVATE_KEY: ${{ runner.temp }}/linux-update-private.pem
          TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_FILE: ${{ runner.temp }}/linux-update-public.pem
          TILECAST_RELEASE_OUTPUT: ${{ runner.temp }}/linux-player-release
          TILECAST_RELEASE_CHANNEL: stable
          TILECAST_RELEASE_NOTES: Pull request release-contract validation
        run: scripts/build-linux-player-release.sh

  server_ci:
    name: Server CI
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tilecast_test
          POSTGRES_USER: tilecast
          POSTGRES_PASSWORD: tilecast_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilecast -d tilecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - working-directory: apps/server
        run: go vet ./...
      - name: Test
        working-directory: apps/server
        run: go test -json -p 1 ./... > test-results.json
        env:
          TEST_DATABASE_URL: postgres://tilecast:tilecast_test_password@localhost:5432/tilecast_test?sslmode=disable
      - name: Test Reporter
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Server tests
          path: apps/server/test-results.json
          reporter: golang-json
          fail-on-empty: false
      - working-directory: apps/server
        run: go build ./cmd/tilecast

  dashboard_ci:
    name: Dashboard CI
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Test
        working-directory: apps/dashboard
        run: |
          mkdir -p test-results
          npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - name: Test Reporter
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Dashboard tests
          path: apps/dashboard/test-results/vitest.xml
          reporter: java-junit
          fail-on-empty: false
      - run: npm run build

  container_ci:
    name: Server container
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --env-file deploy/docker/.env.example -f deploy/docker/compose.yml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  required:
    name: Required PR validation
    if: always()
    needs:
      - changes
      - android_ci
      - linux_player_ci
      - server_ci
      - dashboard_ci
      - container_ci
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ join(needs.*.result, ',') }}
    steps:
      - name: Require every selected job to pass
        run: |
          if [[ ",$RESULTS," == *,failure,* || ",$RESULTS," == *,cancelled,* ]]; then
            echo "One or more required validation jobs did not pass: $RESULTS" >&2
            exit 1
          fi
          echo "All selected validation jobs passed: $RESULTS"
