name: Refine Data Source Signal layout

on:
  push:
    branches:
      - fix/format-data-source-pages
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/format-data-source-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Signal-aligned page treatment
        run: |
          python scripts/refine-data-source-signal.py
          cp scripts/data-sources-signal.css apps/dashboard/src/styles/data-sources.css
          npx prettier --write apps/dashboard/src/pages/DataSourcesPage.tsx apps/dashboard/src/styles/data-sources.css
          npm run format:check
      - name: Commit final files and remove temporary helpers
        run: |
          rm .github/workflows/refine-data-source-signal.yml
          rm scripts/refine-data-source-signal.py scripts/data-sources-signal.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/pages/DataSourcesPage.tsx apps/dashboard/src/styles/data-sources.css .github/workflows/refine-data-source-signal.yml scripts/refine-data-source-signal.py scripts/data-sources-signal.css
          git diff --cached --quiet || git commit -m "Align Data Source pages with Tilecast Signal"
          git push origin HEAD:fix/format-data-source-pages
