name: Refine Data Source Signal layout

on:
  push:
    branches:
      - fix/format-data-source-pages
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/format-data-source-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Signal-aligned layout
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("apps/dashboard/src/pages/DataSourcesPage.tsx")
          text = path.read_text()
          old = '''        <aside className="data-source-create-shell__guide">
          <section>
            <h3>Three steps</h3>
            <ol>
              {copy.steps.map((step, index) => (
                <li key={step}>
                  <span>{index + 1}</span>
                  <p>{step}</p>
                </li>
              ))}
            </ol>
          </section>
          <section className="data-source-create-shell__tip">
            <Lightbulb size={17} />
            <div>
              <strong>Good to know</strong>
              <p>{copy.tip}</p>
            </div>
          </section>
          <p className="data-source-create-shell__advanced-note">
            <Check size={15} /> Advanced filtering and cache controls are
            optional.
          </p>
        </aside>'''
          new = '''        <aside
          className="data-source-create-shell__guide"
          aria-label="Data Source setup guidance"
        >
          <h3>Setup checklist</h3>
          <ol>
            {copy.steps.map((step, index) => (
              <li key={step}>
                <span>{index + 1}</span>
                <p>{step}</p>
              </li>
            ))}
          </ol>
          <div className="data-source-create-shell__tip">
            <Lightbulb size={17} />
            <div>
              <strong>Good to know</strong>
              <p>{copy.tip}</p>
            </div>
          </div>
          <p className="data-source-create-shell__advanced-note">
            <Check size={15} /> Advanced filtering and cache controls are
            optional.
          </p>
        </aside>'''
          if old not in text:
              raise SystemExit("Expected setup guide markup was not found")
          text = text.replace(old, new)
          text = text.replace(
              '''              Choose what you are connecting. Each setup page starts with the
              essentials and keeps advanced options out of the way.''',
              '''              Choose what you are connecting. Every provider uses the same
              compact, predictable setup pattern.''',
          )
          path.write_text(text)
          PY

          cat > apps/dashboard/src/styles/data-sources.css <<'CSS'
          /* Data Source creation pages — Tilecast Signal */
          .data-source-create-shell {
            width: min(1120px, 100%);
            margin: 0 auto;
          }

          .data-source-create-shell__header {
            display: grid;
            gap: var(--tc-space-4);
            margin-bottom: var(--tc-space-4);
          }

          .data-source-create-shell__header > .button {
            width: fit-content;
            min-height: 32px;
            margin: 0;
            padding: 4px 0;
            color: var(--tc-text-secondary);
            background: transparent;
            border-color: transparent;
          }

          .data-source-create-shell__header > .button:hover {
            color: var(--tc-text-primary);
            background: transparent;
          }

          .data-source-create-shell__header > div {
            display: flex;
            align-items: flex-start;
            gap: var(--tc-space-3);
          }

          .data-source-create-shell__icon {
            display: grid;
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            place-items: center;
            color: var(--tc-action-primary);
          }

          .data-source-create-shell__header .eyebrow {
            margin: 0 0 4px;
            color: var(--tc-text-secondary);
          }

          .data-source-create-shell__header h2 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
            letter-spacing: -0.02em;
          }

          .data-source-create-shell__header div > div > p:last-child {
            max-width: 760px;
            margin: var(--tc-space-2) 0 0;
            color: var(--tc-text-secondary);
            line-height: 1.5;
          }

          .data-source-create-shell__layout {
            display: grid;
            grid-template-columns: 224px minmax(0, 1fr);
            align-items: start;
            gap: var(--tc-space-4);
          }

          .data-source-create-shell__guide {
            position: sticky;
            top: 72px;
            padding: var(--tc-space-4);
            background: var(--tc-bg-surface);
            border: 1px solid var(--tc-border-default);
            border-radius: var(--tc-radius-panel);
          }

          .data-source-create-shell__guide h3 {
            margin: 0;
            font-size: 15px;
            line-height: 1.3;
          }

          .data-source-create-shell__guide ol {
            display: grid;
            gap: var(--tc-space-3);
            margin: var(--tc-space-4) 0 0;
            padding: 0;
            list-style: none;
          }

          .data-source-create-shell__guide li {
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr);
            align-items: start;
            gap: var(--tc-space-2);
          }

          .data-source-create-shell__guide li > span {
            display: grid;
            width: 24px;
            height: 24px;
            place-items: center;
            color: var(--tc-action-primary);
            background: var(--tc-action-primary-soft);
            border-radius: var(--tc-radius-pill);
            font-size: 12px;
            font-weight: 700;
          }

          .data-source-create-shell__guide li p {
            margin: 2px 0 0;
            color: var(--tc-text-secondary);
            font-size: 12px;
            line-height: 1.45;
          }

          .data-source-create-shell__tip,
          .data-source-create-shell__advanced-note {
            margin: var(--tc-space-4) 0 0;
            padding-top: var(--tc-space-4);
            border-top: 1px solid var(--tc-border-default);
          }

          .data-source-create-shell__tip {
            display: flex;
            align-items: flex-start;
            gap: var(--tc-space-2);
          }

          .data-source-create-shell__tip > svg {
            flex: 0 0 auto;
            color: var(--tc-text-secondary);
          }

          .data-source-create-shell__tip > div {
            display: grid;
            gap: 4px;
          }

          .data-source-create-shell__tip strong {
            font-size: 13px;
          }

          .data-source-create-shell__tip p,
          .data-source-create-shell__advanced-note {
            color: var(--tc-text-secondary);
            font-size: 12px;
            line-height: 1.45;
          }

          .data-source-create-shell__tip p {
            margin: 0;
          }

          .data-source-create-shell__advanced-note {
            display: flex;
            align-items: flex-start;
            gap: var(--tc-space-2);
          }

          .data-source-create-shell__advanced-note svg {
            flex: 0 0 auto;
            color: var(--tc-status-success);
          }

          .data-source-create-shell__editor {
            min-width: 0;
          }

          .data-source-create-shell__editor > .details-backdrop {
            position: static;
            inset: auto;
            display: block;
            min-height: 0;
            padding: 0;
            overflow: visible;
            background: transparent;
            backdrop-filter: none;
          }

          .data-source-create-shell .source-editor {
            width: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            overflow: visible;
            background: var(--tc-bg-surface);
            border: 1px solid var(--tc-border-default);
            border-radius: var(--tc-radius-panel);
            box-shadow: none;
          }

          .data-source-create-shell .source-editor > header {
            display: none;
          }

          .data-source-create-shell .source-editor__body {
            display: grid;
            gap: var(--tc-space-4);
            padding: var(--tc-space-5);
          }

          .data-source-create-shell .source-editor__body::before {
            content: "Connection and defaults";
            font-size: 18px;
            font-weight: 650;
            line-height: 1.3;
          }

          .data-source-create-shell .source-editor__body > .field,
          .data-source-create-shell .source-editor__body > .form-grid,
          .data-source-create-shell .source-editor__body > fieldset {
            margin: 0;
          }

          .data-source-create-shell .source-editor__body > fieldset {
            padding-top: var(--tc-space-5);
            border-top: 1px solid var(--tc-border-default);
          }

          .data-source-create-shell .source-editor fieldset {
            min-width: 0;
            margin: 0;
            padding-right: 0;
            padding-bottom: 0;
            padding-left: 0;
            border-right: 0;
            border-bottom: 0;
            border-left: 0;
          }

          .data-source-create-shell .source-editor fieldset legend {
            padding: 0;
            font-size: 15px;
            font-weight: 650;
          }

          .data-source-create-shell .source-editor fieldset fieldset {
            margin-top: var(--tc-space-4);
            padding-top: var(--tc-space-4);
            border-top: 1px solid var(--tc-border-default);
          }

          .data-source-create-shell .source-editor .form-grid,
          .data-source-create-shell .source-editor__columns {
            gap: var(--tc-space-4);
          }

          .data-source-create-shell .source-editor .field {
            gap: var(--tc-space-2);
          }

          .data-source-create-shell .source-editor .field__label {
            font-size: 13px;
          }

          .data-source-create-shell .source-editor .field input,
          .data-source-create-shell .source-editor .field select {
            width: 100%;
            min-height: 40px;
          }

          .data-source-create-shell .source-editor .field select {
            padding: 7px 32px 7px 10px;
            color: var(--tc-text-primary);
            background: var(--tc-input-bg);
            border: 1px solid var(--tc-input-border);
            border-radius: var(--tc-radius-control);
          }

          .data-source-create-shell .source-editor .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
            gap: var(--tc-space-2) var(--tc-space-4);
            margin-top: var(--tc-space-3);
          }

          .data-source-create-shell .source-editor .checkbox-grid label,
          .data-source-create-shell .source-editor .checkbox-row {
            display: flex;
            min-height: 32px;
            align-items: center;
            gap: var(--tc-space-2);
          }

          .data-source-create-shell .source-editor .checkbox-grid input,
          .data-source-create-shell .source-editor .checkbox-row input {
            margin: 0;
          }

          .data-source-create-shell .source-editor .switch-row {
            margin-top: var(--tc-space-3);
            padding: var(--tc-space-3) 0;
            border-top: 1px solid var(--tc-border-default);
            border-bottom: 1px solid var(--tc-border-default);
          }

          .data-source-create-shell .source-editor .source-mapping-list {
            display: grid;
            margin-top: var(--tc-space-4);
          }

          .data-source-create-shell .source-editor .source-mapping-list > strong {
            margin-bottom: var(--tc-space-2);
            font-size: 13px;
          }

          .data-source-create-shell .source-editor .source-mapping-row {
            display: grid;
            grid-template-columns: minmax(120px, 0.8fr) minmax(160px, 1.2fr) auto;
            gap: var(--tc-space-2);
            align-items: center;
            padding: var(--tc-space-2) 0;
            border-top: 1px solid var(--tc-border-default);
          }

          .data-source-create-shell .source-editor .source-mapping-row input,
          .data-source-create-shell .source-editor .source-mapping-row select {
            width: 100%;
            min-height: 40px;
          }

          .data-source-create-shell .source-editor .source-diagnostics,
          .data-source-create-shell .source-editor .calendar-preview,
          .data-source-create-shell .source-editor .source-preview-list {
            margin: 0 var(--tc-space-5) var(--tc-space-5);
            padding: var(--tc-space-4);
            background: var(--tc-bg-subtle);
            border: 1px solid var(--tc-border-default);
            border-radius: var(--tc-radius-control);
          }

          .data-source-create-shell .source-editor > footer,
          .data-source-create-shell .source-editor footer {
            position: sticky;
            bottom: 0;
            z-index: 3;
            display: flex;
            justify-content: flex-end;
            gap: var(--tc-space-2);
            margin: 0;
            padding: var(--tc-space-3) var(--tc-space-5);
            background: var(--tc-bg-surface);
            border-top: 1px solid var(--tc-border-default);
          }

          .data-source-create-shell .source-editor footer .button {
            min-width: 132px;
            min-height: 40px;
            margin: 0;
          }

          /* Calendar editor uses direct children instead of source-editor__body. */
          .data-source-create-shell--calendar .source-editor {
            display: grid;
          }

          .data-source-create-shell--calendar .source-editor > .source-editor__columns,
          .data-source-create-shell--calendar .source-editor > .source-editor__fieldset {
            margin: 0 var(--tc-space-5);
            padding: var(--tc-space-5) 0;
          }

          .data-source-create-shell--calendar
            .source-editor
            > .source-editor__columns
            + .source-editor__fieldset,
          .data-source-create-shell--calendar
            .source-editor
            > .source-editor__fieldset
            + .source-editor__columns,
          .data-source-create-shell--calendar
            .source-editor
            > .source-editor__fieldset
            + .source-editor__fieldset {
            border-top: 1px solid var(--tc-border-default);
          }

          .data-source-create-shell--calendar
            .source-editor
            > .source-editor__columns:first-of-type::before {
            content: "Name and description";
            grid-column: 1 / -1;
            margin-bottom: var(--tc-space-1);
            font-size: 18px;
            font-weight: 650;
          }

          .data-source-create-shell--calendar
            .source-editor
            > .source-editor__columns:nth-of-type(2)::before {
            content: "Default event view";
            grid-column: 1 / -1;
            margin-bottom: var(--tc-space-1);
            font-size: 15px;
            font-weight: 650;
          }

          .data-source-create-shell--calendar
            .source-editor
            > .source-editor__columns:last-of-type::before {
            content: "Filtering and cache behavior";
            grid-column: 1 / -1;
            margin-bottom: var(--tc-space-1);
            font-size: 15px;
            font-weight: 650;
          }

          /* Provider selection is a compact page panel, not a modal gallery. */
          .app-editor-route > .details-backdrop:has(.source-gallery) {
            position: static;
            display: block;
            padding: 0;
            background: transparent;
            backdrop-filter: none;
          }

          .app-editor-route .source-gallery {
            width: min(880px, 100%);
            max-width: none;
            margin: 0 auto;
            overflow: hidden;
            background: var(--tc-bg-surface);
            border: 1px solid var(--tc-border-default);
            border-radius: var(--tc-radius-panel);
            box-shadow: none;
          }

          .app-editor-route .source-gallery > header {
            padding: var(--tc-space-5);
            border-bottom: 1px solid var(--tc-border-default);
          }

          .app-editor-route .source-gallery > header h2 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
            letter-spacing: -0.02em;
          }

          .app-editor-route .source-gallery > header p {
            max-width: 680px;
            margin: var(--tc-space-2) 0 0;
            color: var(--tc-text-secondary);
          }

          .app-editor-route .source-provider-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--tc-space-2);
            padding: var(--tc-space-4);
          }

          .app-editor-route .source-provider-grid button {
            display: grid;
            grid-template-columns: 32px minmax(0, 1fr);
            grid-template-rows: auto auto;
            column-gap: var(--tc-space-3);
            row-gap: 2px;
            align-items: center;
            min-height: 76px;
            padding: var(--tc-space-3);
            color: var(--tc-text-primary);
            text-align: left;
            background: var(--tc-bg-surface);
            border: 1px solid var(--tc-border-default);
            border-radius: var(--tc-radius-control);
            cursor: pointer;
            transition:
              background var(--tc-motion-fast),
              border-color var(--tc-motion-fast);
          }

          .app-editor-route .source-provider-grid button:hover {
            background: var(--tc-action-primary-soft);
            border-color: var(--tc-action-primary);
          }

          .app-editor-route .source-provider-grid button > svg {
            grid-row: 1 / span 2;
            color: var(--tc-action-primary);
          }

          .app-editor-route .source-provider-grid strong {
            align-self: end;
            font-size: 15px;
          }

          .app-editor-route .source-provider-grid span {
            align-self: start;
            color: var(--tc-text-secondary);
            font-size: 12px;
            line-height: 1.4;
          }

          @media (max-width: 900px) {
            .data-source-create-shell__layout {
              grid-template-columns: 1fr;
            }

            .data-source-create-shell__guide {
              position: static;
            }
          }

          @media (max-width: 680px) {
            .app-editor-route .source-provider-grid,
            .data-source-create-shell .source-editor__body > .form-grid,
            .data-source-create-shell .source-editor > .source-editor__columns {
              grid-template-columns: 1fr;
            }

            .data-source-create-shell .source-editor .source-mapping-row {
              grid-template-columns: 1fr;
            }

            .data-source-create-shell .source-editor > footer,
            .data-source-create-shell .source-editor footer {
              position: static;
            }

            .data-source-create-shell .source-editor footer .button {
              flex: 1;
              min-width: 0;
            }
          }
          CSS

      - name: Format and validate
        run: |
          npx prettier --write apps/dashboard/src/pages/DataSourcesPage.tsx apps/dashboard/src/styles/data-sources.css
          npm run format:check
          npm run lint
          npm run build
          npm test
      - name: Commit Signal-aligned files and remove one-time workflow
        run: |
          rm .github/workflows/refine-data-source-signal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/pages/DataSourcesPage.tsx apps/dashboard/src/styles/data-sources.css .github/workflows/refine-data-source-signal.yml
          git diff --cached --quiet || git commit -m "Align Data Source pages with Tilecast Signal"
          git push origin HEAD:fix/format-data-source-pages
