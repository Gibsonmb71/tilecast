name: Sync GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mirror the wiki/ directory to the GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          wiki_checkout="$RUNNER_TEMP/tilecast-wiki"
          git clone --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$wiki_checkout"

          # The repository's wiki/ directory is the single source of truth.
          # Remove every tracked page in the wiki checkout, then copy the
          # current set from the repo, so renames and deletions propagate.
          find "$wiki_checkout" -maxdepth 1 -name '*.md' -delete
          cp wiki/*.md "$wiki_checkout/"

          cd "$wiki_checkout"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already current."
            exit 0
          fi

          git commit -m "docs: sync wiki from repository wiki/ directory"
          git push
