name: Temporary timezone dropdown fix

on:
  push:
    branches: [gibby/fix-timezone-dropdown]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message != 'Fix select menu scroll handling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gibby/fix-timezone-dropdown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch shared select and regression test
        run: |
          python3 <<'PY'
          from pathlib import Path

          select_path = Path("apps/dashboard/src/components/ui/SignalSelect.tsx")
          select_source = select_path.read_text()
          old_scroll = '''    const close = () => setOpen(false);
              window.addEventListener("resize", close);
              window.addEventListener("scroll", close, true);
              return () => {
                window.removeEventListener("resize", close);
                window.removeEventListener("scroll", close, true);
              };'''
          new_scroll = '''    const close = () => setOpen(false);
              const closeOnExternalScroll = (event: Event) => {
                const target = event.target;
                const listbox = document.getElementById(listboxId);
                if (target instanceof Node && listbox?.contains(target)) return;
                setOpen(false);
              };
              window.addEventListener("resize", close);
              window.addEventListener("scroll", closeOnExternalScroll, true);
              return () => {
                window.removeEventListener("resize", close);
                window.removeEventListener("scroll", closeOnExternalScroll, true);
              };'''
          if old_scroll not in select_source:
              raise SystemExit("SignalSelect scroll handler block not found")
          select_path.write_text(select_source.replace(old_scroll, new_scroll, 1))

          test_path = Path("apps/dashboard/src/settings/settingsExperience.test.tsx")
          test_source = test_path.read_text()
          old_assertion = '''    expect(document.querySelector(".signal-select__native")).toHaveValue(
              "America/New_York",
            );

            expect(
              normalizeSettingValues('''
          new_assertion = '''    expect(document.querySelector(".signal-select__native")).toHaveValue(
              "America/New_York",
            );

            fireEvent.click(timezone);
            const timezoneListbox = screen.getByRole("listbox");
            fireEvent.scroll(timezoneListbox);
            expect(screen.getByRole("listbox")).toBeInTheDocument();
            fireEvent.scroll(window);
            expect(screen.queryByRole("listbox")).not.toBeInTheDocument();

            expect(
              normalizeSettingValues('''
          if old_assertion not in test_source:
              raise SystemExit("Timezone settings test insertion point not found")
          test_path.write_text(test_source.replace(old_assertion, new_assertion, 1))
          PY
      - run: npm ci
      - run: npx prettier --write apps/dashboard/src/components/ui/SignalSelect.tsx apps/dashboard/src/settings/settingsExperience.test.tsx
      - run: npx prettier --check apps/dashboard/src/components/ui/SignalSelect.tsx apps/dashboard/src/settings/settingsExperience.test.tsx
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/components/ui/SignalSelect.tsx apps/dashboard/src/settings/settingsExperience.test.tsx
          git commit -m "Fix select menu scroll handling"
          git push origin HEAD:gibby/fix-timezone-dropdown
