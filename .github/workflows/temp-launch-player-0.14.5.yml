name: Launch Tilecast Player 0.14.5

on:
  push:
    branches: [main]
    paths:
      - "apps/player-android/app/build.gradle.kts"
      - ".github/workflows/temp-launch-player-0.14.5.yml"

permissions:
  contents: write
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag and dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: player-v0.14.5
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/player-android/app/build.gradle.kts | head -1)"
          code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' apps/player-android/app/build.gradle.kts | head -1)"
          test "$version" = "0.14.5"
          test "$code" = "29"

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to move it." >&2
            exit 1
          fi

          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Tilecast Player 0.14.5"
          git push origin "$RELEASE_TAG"

          gh workflow run player-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f channel=stable \
            -f release_notes=$'## What’s new\n\n- Adds outside-active-hours choices for a bouncing Tilecast logo, custom text, or a completely black screen.\n- Keeps Fire TV devices awake outside active hours and blocks sleep requests that could leave them unreachable.\n- Includes recent player reliability and settings compatibility fixes.'
