name: Temporary simplify timezone selector

on:
  push:
    branches: [gibby/simplify-timezone-options]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message != 'Simplify timezone options'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gibby/simplify-timezone-options
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Simplify timezone choices
        run: |
          cat > apps/dashboard/src/settings/settingValues.ts <<'EOF'
          import type { SettingDefinition } from "../api/types";

          const legacyTimezoneAliases: Record<string, string> = {
            EST: "America/New_York",
            EDT: "America/New_York",
            CST: "America/Chicago",
            CDT: "America/Chicago",
            MST: "America/Denver",
            MDT: "America/Denver",
            PST: "America/Los_Angeles",
            PDT: "America/Los_Angeles",
          };

          const commonTimezoneLabels: Record<string, string> = {
            UTC: "UTC",
            "America/Halifax": "Atlantic Time",
            "America/New_York": "Eastern Time",
            "America/Chicago": "Central Time",
            "America/Denver": "Mountain Time",
            "America/Phoenix": "Arizona Time",
            "America/Los_Angeles": "Pacific Time",
            "America/Anchorage": "Alaska Time",
            "Pacific/Honolulu": "Hawaii Time",
          };

          const commonTimezones = Object.keys(commonTimezoneLabels);
          const localTimePattern = /^(?:[01]\d|2[0-3]):[0-5]\d(?::00)?$/;

          export function normalizeLocalTime(value: unknown) {
            if (typeof value !== "string") return "";
            const trimmed = value.trim();
            return localTimePattern.test(trimmed) ? trimmed.slice(0, 5) : trimmed;
          }

          export function normalizeTimezone(value: unknown) {
            if (typeof value !== "string") return "";
            const trimmed = value.trim();
            return legacyTimezoneAliases[trimmed] ?? trimmed;
          }

          export function normalizeSettingValues(
            values: Record<string, unknown>,
            definitions: SettingDefinition[],
          ) {
            const normalized = { ...values };
            for (const definition of definitions) {
              if (!Object.hasOwn(normalized, definition.key)) continue;
              if (definition.type === "local_time")
                normalized[definition.key] = normalizeLocalTime(
                  normalized[definition.key],
                );
              if (definition.type === "timezone")
                normalized[definition.key] = normalizeTimezone(
                  normalized[definition.key],
                );
            }
            return normalized;
          }

          export function timezoneOptions(current: unknown) {
            const zones = [...commonTimezones];
            const normalizedCurrent = normalizeTimezone(current);
            if (
              !zones.includes(normalizedCurrent) &&
              (normalizedCurrent === "UTC" ||
                (normalizedCurrent.includes("/") && normalizedCurrent.length < 200))
            )
              zones.push(normalizedCurrent);
            return zones;
          }

          export function timezoneLabel(zone: string) {
            return (
              commonTimezoneLabels[zone] ??
              zone.replaceAll("_", " ").replace("/", " — ")
            );
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/dashboard/src/settings/settingsExperience.test.tsx")
          source = path.read_text()
          source = source.replace(
              'expect(timezone).toHaveTextContent("Eastern Time (America/New_York)");',
              'expect(timezone).toHaveTextContent("Eastern Time");',
              1,
          )
          insertion = '''    expect(document.querySelector(".signal-select__native")).toHaveValue(
              "America/New_York",
            );
          '''
          replacement = '''    expect(document.querySelector(".signal-select__native")).toHaveValue(
              "America/New_York",
            );
            expect(screen.queryByText(/America\\/New_York/)).not.toBeInTheDocument();
          '''
          if insertion not in source:
              raise SystemExit("Timezone assertion insertion point not found")
          path.write_text(source.replace(insertion, replacement, 1))
          PY
      - run: npm ci
      - run: npx prettier --write apps/dashboard/src/settings/settingValues.ts apps/dashboard/src/settings/settingsExperience.test.tsx
      - run: npx prettier --check apps/dashboard/src/settings/settingValues.ts apps/dashboard/src/settings/settingsExperience.test.tsx
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/settings/settingValues.ts apps/dashboard/src/settings/settingsExperience.test.tsx
          git commit -m "Simplify timezone options"
          git push origin HEAD:gibby/simplify-timezone-options
