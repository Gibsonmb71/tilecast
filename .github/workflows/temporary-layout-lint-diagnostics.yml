name: Temporary layout lint diagnostics

on:
  push:
    branches: [feature/visual-layout-library]

permissions:
  contents: write

jobs:
  lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture lint output
        run: |
          npm run lint > tmp-layout-lint-output.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-layout-lint-output.txt
          git commit -m "Capture layout lint diagnostics"
          git push
