name: Temporary layout test diagnostics

on:
  push:
    branches: [feature/visual-layout-library]

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture test output
        run: |
          npm test --workspace @tilecast/dashboard -- --run src/pages/LayoutsPage.test.tsx > tmp-layout-test-output.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-layout-test-output.txt
          git commit -m "Capture layout test diagnostics"
          git push
