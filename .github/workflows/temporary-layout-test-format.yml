name: Temporary layout test formatter

on:
  push:
    branches: [feature/visual-layout-library]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/dashboard/src/pages/LayoutsPage.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/pages/LayoutsPage.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format layout library tests"
            git push
          fi
