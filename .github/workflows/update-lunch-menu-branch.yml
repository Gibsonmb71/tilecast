name: Update lunch menu branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lunch-menu-workflow
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Merge current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit origin/main
          git rm -f --ignore-unmatch .github/workflows/update-lunch-menu-branch.yml

      - run: npm ci
      - run: npx prettier --write .
      - run: git diff --check

      - name: Commit and push merged branch
        shell: bash
        run: |
          git add -A
          git commit -m "Merge main into lunch menu fixes"
          git push origin HEAD:fix/lunch-menu-workflow
