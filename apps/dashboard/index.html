<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18201d" />
    <meta name="description" content="Tilecast signage management" />
    <script>
      (() => {
        try {
          const value = localStorage.getItem("tilecast.appearance");
          document.documentElement.dataset.theme = ["light", "dark", "system"].includes(value)
            ? value
            : "system";
        } catch {
          document.documentElement.dataset.theme = "system";
        }
      })();
    </script>
    <style>
      html { background: #f6f8fa; }
      html[data-theme="dark"] { background: #101820; }
      @media (prefers-color-scheme: dark) {
        html[data-theme="system"] { background: #101820; }
      }
    </style>
    <title>Tilecast</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
