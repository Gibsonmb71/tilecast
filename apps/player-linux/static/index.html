<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' tcmedia: data:; media-src tcmedia:; frame-src https: http:;"
    />
    <title>Tilecast Player</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #e6e6e6;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow: hidden;
        cursor: none;
        user-select: none;
      }
      .layer {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 300ms ease;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #content-stage {
        position: absolute;
        inset: 0;
        transition: bottom 240ms ease;
      }
      #content-stage.plugin-push {
        bottom: var(--plugin-height, 72px);
      }
      #countdown-bar {
        position: absolute;
        display: flex;
        visibility: hidden;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--plugin-height, 72px);
        z-index: 25;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        gap: 0.35em;
        padding: 0 4vw;
        background: rgba(13, 20, 27, 0.96);
        color: #fff;
        border-top: 1px solid rgba(255, 255, 255, 0.24);
        font-size: clamp(22px, calc(var(--plugin-height, 72px) * 0.42), 72px);
        font-weight: 600;
        line-height: 1;
        transform: translateY(100%);
        transition: transform 240ms ease;
      }
      #countdown-bar.visible {
        visibility: visible;
        transform: translateY(0);
      }
      #countdown-bar .countdown-value {
        font-variant-numeric: tabular-nums;
        font-weight: 750;
      }
      .layer.visible {
        opacity: 1;
      }
      .layer img,
      .layer video,
      .layer webview {
        width: 100%;
        height: 100%;
        border: 0;
      }
      #message {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
        padding: 48px;
        background: #000;
        z-index: 20;
      }
      #message.visible {
        display: flex;
      }
      #message h1 {
        font-size: 56px;
        font-weight: 600;
        margin: 0;
      }
      #message .brand-logo {
        width: min(420px, 42vw);
        height: auto;
        margin-bottom: 8px;
      }
      #message p {
        font-size: 28px;
        margin: 0;
        color: #9a9a9a;
        max-width: 70%;
      }
      #message .code {
        font-size: 120px;
        letter-spacing: 0.25em;
        font-weight: 700;
        font-family: ui-monospace, Menlo, monospace;
        color: #fff;
      }
      #setup-input {
        font-size: 28px;
        padding: 12px 20px;
        width: 60%;
        border-radius: 8px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
      }
      #setup-error {
        color: #ff6b6b;
        font-size: 22px;
        min-height: 28px;
      }
      #identify {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        background: rgba(20, 20, 20, 0.92);
        border: 2px solid #fff;
        border-radius: 12px;
        padding: 24px 48px;
        font-size: 44px;
        font-weight: 700;
        z-index: 30;
      }
      #identify.visible {
        display: block;
      }
      @keyframes tc-marquee-left {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-100%);
        }
      }
      @keyframes tc-marquee-right {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="content-stage">
      <div id="layer-a" class="layer"></div>
      <div id="layer-b" class="layer"></div>
      <div id="message"></div>
    </div>
    <div id="countdown-bar" role="status" aria-live="polite">
      <span class="countdown-message"></span>
      <span class="countdown-value"></span>
    </div>
    <div id="identify"></div>
    <script src="../dist/renderer/playback-policy.js"></script>
    <script src="../dist/renderer/countdown-display.js"></script>
    <script src="../dist/renderer/renderer.js"></script>
    <script src="../dist/renderer/synchronized-video.js"></script>
    <script src="../dist/renderer/outside-hours.js"></script>
  </body>
</html>
