<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' tcmedia: data:; media-src tcmedia:; frame-src https: http:;"
    />
    <title>Tilecast Player</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #e6e6e6;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow: hidden;
        cursor: none;
        user-select: none;
      }
      .layer {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 300ms ease;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #content-stage {
        position: absolute;
        inset: 0;
        transition: bottom 240ms ease;
      }
      #content-stage.plugin-push {
        bottom: var(--plugin-height, 72px);
      }
      #countdown-bar {
        position: absolute;
        display: flex;
        visibility: hidden;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--plugin-height, 72px);
        z-index: 25;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        gap: 0.35em;
        padding: 0 var(--plugin-bar-padding, 4%);
        background: rgba(13, 20, 27, 0.96);
        color: #fff;
        border-top: 1px solid rgba(255, 255, 255, 0.24);
        font-size: var(--plugin-bar-font-size, 30px);
        font-weight: 600;
        line-height: 1;
        transform: translateY(100%);
        transition: transform 240ms ease;
      }
      #countdown-bar.visible {
        visibility: visible;
        transform: translateY(0);
      }
      #countdown-bar .countdown-message,
      #countdown-bar .countdown-value {
        position: relative;
        z-index: 1;
      }
      #countdown-bar .countdown-message:empty {
        display: none;
      }
      #countdown-bar .countdown-value {
        font-variant-numeric: tabular-nums;
        font-weight: 750;
      }
      /* The draining fill sits behind the text and shrinks toward the left, so
         at zero only the bar background is left. Width is set from the resolved
         remaining fraction; the transition smooths the once-a-second step
         without implying a precision the clock does not have. A negative
         z-index would paint it behind the bar's own background and disappear,
         so it stays at 0 and the text is lifted above it instead. */
      #countdown-bar .countdown-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        z-index: 0;
        background: rgba(255, 255, 255, 0.16);
        border-right: 2px solid rgba(255, 255, 255, 0.42);
        transition: width 960ms linear;
      }
      #countdown-confetti {
        position: absolute;
        inset: 0;
        z-index: 30;
        overflow: hidden;
        pointer-events: none;
      }
      .countdown-confetti__piece {
        position: absolute;
        top: -24px;
        left: var(--confetti-x);
        width: var(--confetti-width);
        height: var(--confetti-height);
        border-radius: var(--confetti-radius);
        opacity: 0;
        background: var(--confetti-color);
        animation: countdown-confetti-fall var(--confetti-duration) linear
          var(--confetti-delay) both;
      }
      @keyframes countdown-confetti-fall {
        0% {
          opacity: 1;
          transform: translate3d(0, -24px, 0) rotate(0deg);
        }
        88% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate3d(var(--confetti-drift), calc(100vh + 48px), 0)
            rotate(var(--confetti-spin));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #countdown-bar .countdown-fill {
          transition: none;
        }
        #countdown-confetti {
          display: none;
        }
      }
      /* The Emergency Alerts ticker shares the bar slot and the push geometry
         with the Countdown Bar, and differs in what it has to carry: alert text
         far longer than a bar is wide. The severity stays fixed at the left edge
         so it is readable at any moment, and the message scrolls past it. */
      #alert-ticker {
        position: absolute;
        display: flex;
        visibility: hidden;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--plugin-height, 96px);
        z-index: 26;
        box-sizing: border-box;
        align-items: center;
        overflow: hidden;
        background: rgba(122, 31, 31, 0.97);
        color: #fff;
        border-top: 2px solid rgba(255, 214, 214, 0.65);
        font-size: clamp(22px, calc(var(--plugin-height, 96px) * 0.4), 64px);
        font-weight: 650;
        line-height: 1;
        transform: translateY(100%);
        transition: transform 240ms ease;
      }
      #alert-ticker.visible {
        visibility: visible;
        transform: translateY(0);
      }
      #alert-ticker .ticker-severity {
        flex: none;
        z-index: 1;
        margin: 0 1.5vw;
        padding: 0.22em 0.6em;
        border-radius: 0.25em;
        background: #fff;
        color: #7a1f1f;
        font-size: 0.62em;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #alert-ticker .ticker-severity[hidden] {
        display: none;
      }
      #alert-ticker .ticker-viewport {
        position: relative;
        flex: 1;
        height: 100%;
        overflow: hidden;
      }
      /* The track is positioned from the right edge of the viewport and travels
         left by its own width plus the viewport's, which the renderer measures
         and publishes as --ticker-distance. */
      #alert-ticker .ticker-track {
        position: absolute;
        top: 0;
        left: 100%;
        display: flex;
        align-items: center;
        height: 100%;
        white-space: nowrap;
        will-change: transform;
      }
      @keyframes ticker-scroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(calc(var(--ticker-distance, 100vw) * -1));
        }
      }
      /* A reader who cannot follow motion still has to receive the alert, so the
         message stops moving and is clipped at the bar's width instead. */
      @media (prefers-reduced-motion: reduce) {
        #alert-ticker .ticker-track {
          left: 0;
          animation: none !important;
          max-width: 100%;
        }
        /* Constrained by the track, not by the viewport: the severity chip takes
           part of the bar, and the bar is not always the full screen width. */
        #alert-ticker .ticker-message {
          overflow: hidden;
          text-overflow: ellipsis;
          max-width: 100%;
        }
      }
      .layer.visible {
        opacity: 1;
      }
      .layer img,
      .layer video,
      .layer webview {
        width: 100%;
        height: 100%;
        border: 0;
      }
      #message {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
        padding: 48px;
        background: #000;
        z-index: 20;
      }
      #message.visible {
        display: flex;
      }
      #message h1 {
        font-size: 56px;
        font-weight: 600;
        margin: 0;
      }
      #message .brand-logo {
        width: min(420px, 42vw);
        height: auto;
        margin-bottom: 8px;
      }
      #message p {
        font-size: 28px;
        margin: 0;
        color: #9a9a9a;
        max-width: 70%;
      }
      #message .code {
        font-size: 120px;
        letter-spacing: 0.25em;
        font-weight: 700;
        font-family: ui-monospace, Menlo, monospace;
        color: #fff;
      }
      #setup-input {
        font-size: 28px;
        padding: 12px 20px;
        width: 60%;
        border-radius: 8px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
      }
      #setup-error {
        color: #ff6b6b;
        font-size: 22px;
        min-height: 28px;
      }
      #identify {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        background: rgba(20, 20, 20, 0.92);
        border: 2px solid #fff;
        border-radius: 12px;
        padding: 24px 48px;
        font-size: 44px;
        font-weight: 700;
        z-index: 30;
      }
      #identify.visible {
        display: block;
      }
      @keyframes tc-marquee-left {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-100%);
        }
      }
      @keyframes tc-marquee-right {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="content-stage">
      <div id="layer-a" class="layer"></div>
      <div id="layer-b" class="layer"></div>
      <div id="message"></div>
    </div>
    <div id="countdown-bar" role="status" aria-live="polite">
      <span class="countdown-fill" aria-hidden="true"></span>
      <span class="countdown-message"></span>
      <span class="countdown-value"></span>
    </div>
    <div id="countdown-confetti" aria-hidden="true"></div>
    <div id="alert-ticker" role="alert" aria-live="assertive">
      <span class="ticker-severity"></span>
      <span class="ticker-viewport">
        <span class="ticker-track"><span class="ticker-message"></span></span>
      </span>
    </div>
    <div id="identify"></div>
    <script src="../dist/renderer/playback-policy.js"></script>
    <script src="../dist/renderer/countdown-display.js"></script>
    <script src="../dist/renderer/countdown-bar-resolver.js"></script>
    <script src="../dist/renderer/alert-ticker-resolver.js"></script>
    <script src="../dist/renderer/renderer.js"></script>
    <script src="../dist/renderer/synchronized-video.js"></script>
    <script src="../dist/renderer/outside-hours.js"></script>
  </body>
</html>
