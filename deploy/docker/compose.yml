name: tilecast

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: tilecast/server:local
    restart: unless-stopped
    environment:
      TILECAST_ENV: production
      TILECAST_HTTP_ADDR: :8080
      TILECAST_DATABASE_URL: postgres://${POSTGRES_USER:-tilecast}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tilecast}?sslmode=disable
      TILECAST_PUBLIC_URL: ${TILECAST_PUBLIC_URL:-http://localhost:8080}
      TILECAST_COOKIE_SECURE: ${TILECAST_COOKIE_SECURE:-false}
      TILECAST_SESSION_TTL: ${TILECAST_SESSION_TTL:-24h}
      TILECAST_LOG_LEVEL: ${TILECAST_LOG_LEVEL:-info}
      TILECAST_MDNS_ENABLED: ${TILECAST_MDNS_ENABLED:-false}
      TILECAST_MEDIA_ROOT: /data/media
      TILECAST_MAX_UPLOAD_BYTES: ${TILECAST_MAX_UPLOAD_BYTES:-10737418240}
      TILECAST_MEDIA_WORKERS: ${TILECAST_MEDIA_WORKERS:-2}
      TILECAST_MEDIA_RESERVED_FREE_BYTES: ${TILECAST_MEDIA_RESERVED_FREE_BYTES:-1073741824}
      TILECAST_FFMPEG_PATH: /usr/bin/ffmpeg
      TILECAST_FFPROBE_PATH: /usr/bin/ffprobe
      TILECAST_VIDEO_MAX_WIDTH: ${TILECAST_VIDEO_MAX_WIDTH:-1920}
      TILECAST_VIDEO_MAX_HEIGHT: ${TILECAST_VIDEO_MAX_HEIGHT:-1080}
      TILECAST_VIDEO_MAX_FRAME_RATE: ${TILECAST_VIDEO_MAX_FRAME_RATE:-60}
      TILECAST_KEEP_ORIGINALS: ${TILECAST_KEEP_ORIGINALS:-true}
      TILECAST_MAX_SCHEDULES: ${TILECAST_MAX_SCHEDULES:-1000}
      TILECAST_MAX_SCHEDULE_TARGETS: ${TILECAST_MAX_SCHEDULE_TARGETS:-250}
      TILECAST_MAX_GROUPS_PER_SCREEN: ${TILECAST_MAX_GROUPS_PER_SCREEN:-50}
      TILECAST_SCHEDULE_PREFETCH_DAYS: ${TILECAST_SCHEDULE_PREFETCH_DAYS:-14}
      TILECAST_SCHEDULE_ACTIVATION_GRACE_SECONDS: ${TILECAST_SCHEDULE_ACTIVATION_GRACE_SECONDS:-30}
      TILECAST_CLOCK_SKEW_WARNING_SECONDS: ${TILECAST_CLOCK_SKEW_WARNING_SECONDS:-300}
      TILECAST_WEBSITE_ALLOW_PRIVATE_HTTP: ${TILECAST_WEBSITE_ALLOW_PRIVATE_HTTP:-false}
      TILECAST_WEBSITE_DEFAULT_TIMEOUT_SECONDS: ${TILECAST_WEBSITE_DEFAULT_TIMEOUT_SECONDS:-20}
      TILECAST_WEBSITE_MAX_TIMEOUT_SECONDS: ${TILECAST_WEBSITE_MAX_TIMEOUT_SECONDS:-120}
      TILECAST_WEBSITE_MIN_REFRESH_SECONDS: ${TILECAST_WEBSITE_MIN_REFRESH_SECONDS:-30}
      TILECAST_WEBSITE_MAX_ALLOWED_HOSTS: ${TILECAST_WEBSITE_MAX_ALLOWED_HOSTS:-25}
      TILECAST_WEBSITE_MAX_ASSETS: ${TILECAST_WEBSITE_MAX_ASSETS:-500}
      TILECAST_MAX_EMERGENCY_DURATION_HOURS: ${TILECAST_MAX_EMERGENCY_DURATION_HOURS:-24}
      TILECAST_MAX_EMERGENCY_TARGETS: ${TILECAST_MAX_EMERGENCY_TARGETS:-250}
      TILECAST_MAX_PENDING_COMMANDS_PER_SCREEN: ${TILECAST_MAX_PENDING_COMMANDS_PER_SCREEN:-50}
      TILECAST_DEFAULT_COMMAND_EXPIRY_MINUTES: ${TILECAST_DEFAULT_COMMAND_EXPIRY_MINUTES:-10}
      TILECAST_IDENTIFY_SCREEN_MAX_SECONDS: ${TILECAST_IDENTIFY_SCREEN_MAX_SECONDS:-120}
      TILECAST_COMMAND_RETENTION_DAYS: ${TILECAST_COMMAND_RETENTION_DAYS:-30}
      TILECAST_UPDATE_ROOT: /data/updates
      TILECAST_UPDATE_MANIFEST_PUBLIC_KEY: ${TILECAST_UPDATE_MANIFEST_PUBLIC_KEY:-}
      TILECAST_UPDATE_MAX_APK_BYTES: ${TILECAST_UPDATE_MAX_APK_BYTES:-536870912}
      TILECAST_UPDATE_RETENTION_DAYS: ${TILECAST_UPDATE_RETENTION_DAYS:-90}
      TILECAST_GITHUB_TOKEN: ${TILECAST_GITHUB_TOKEN:-}
    ports:
      - "${TILECAST_PORT:-8080}:8080"
    volumes:
      - tilecast_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tilecast}
      POSTGRES_USER: ${POSTGRES_USER:-tilecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      server:
        condition: service_healthy

volumes:
  tilecast_data:
  postgres_data:
