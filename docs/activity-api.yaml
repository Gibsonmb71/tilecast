openapi: 3.1.0
info:
  title: Tilecast Activity API
  version: 1.0.0
paths:
  /api/v1/player/activity-events:
    post:
      summary: Upload a bounded batch of append-only Player activity events
      security: [{ playerCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/PlayerActivityEvent" }
      responses:
        "202":
          description: Events accepted or idempotently acknowledged
  /api/v1/activity/overview:
    get:
      summary: Read the derived operational overview
      parameters:
        [
          { $ref: "#/components/parameters/From" },
          { $ref: "#/components/parameters/To" },
        ]
      responses: { "200": { description: Activity overview } }
  /api/v1/activity/uptime:
    get:
      summary: Read fleet uptime for the System overview graphs
      description:
        Derived from recorded screen-state intervals. An open healthy interval is
        clipped to the last heartbeat plus the gap grace period, so a player that
        stopped reporting counts as down. Time before a screen's first recorded
        interval is reported as unmeasured rather than as downtime.
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: [24h, 7d], default: 24h }
      responses:
        "200":
          description: Fleet totals, one bucket per interval, and per-screen strips
        "422": { description: Unsupported window }
  /api/v1/activity/proof-of-play:
    get:
      summary: List Player-confirmed playback sessions
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: screen, in: query, schema: { type: string, format: uuid } }
        - { name: group, in: query, schema: { type: string, format: uuid } }
        - { name: result, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        { "200": { description: Stable page of proof-of-play sessions } }
  /api/v1/activity/proof-of-play/summary:
    get:
      summary: Summarize proof of play by screen, content, presentation, or schedule
      responses: { "200": { description: Aggregated proof-of-play coverage } }
  /api/v1/activity/proof-of-play/export.csv:
    get:
      summary: Export proof of play as CSV
      responses: { "200": { description: CSV export } }
  /api/v1/activity/screen-events:
    get:
      summary: List technical screen events
      responses: { "200": { description: Stable page of screen events } }
  /api/v1/activity/audit:
    get:
      summary: List authenticated administrative changes
      responses: { "200": { description: Stable page of audit records } }
  /api/v1/activity/audit/export.csv:
    get:
      summary: Export audit records as CSV
      responses: { "200": { description: CSV export } }
  /api/v1/activity/screens/{screenId}:
    get:
      summary: Read the Activity section for one screen
      parameters:
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: Screen Activity summary } }
  /api/v1/activity/retention:
    get:
      summary: Read Activity retention settings
      responses: { "200": { description: Retention settings } }
    patch:
      summary: Update bounded Activity retention settings
      responses: { "200": { description: Updated retention settings } }
components:
  securitySchemes:
    playerCredential:
      type: http
      scheme: bearer
  parameters:
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 250, default: 50 },
      }
  schemas:
    PlayerActivityEvent:
      type: object
      required: [id, sequence, eventType, occurredAt]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, format: int64, minimum: 1 }
        eventType: { type: string }
        category: { type: string }
        severity:
          { type: string, enum: [debug, info, warning, error, critical] }
        occurredAt: { type: string, format: date-time }
        elapsedRealtimeMs: { type: integer, format: int64, minimum: 0 }
        playerTimezone: { type: string }
        manifestVersion: { type: integer, format: int64 }
        presentationType: { type: string }
        presentationId: { type: string }
        presentationRevision: { type: string }
        contentType: { type: string }
        contentId: { type: string }
        playlistItemId: { type: string }
        layoutPlacementId: { type: string }
        activitySessionId: { type: string }
        result:
          {
            type: string,
            enum:
              [
                playing,
                completed,
                partial,
                skipped,
                failed,
                unknown,
                recovered,
                success,
              ],
          }
        durationMs: { type: integer, format: int64, minimum: 0 }
        expectedDurationMs: { type: integer, format: int64, minimum: 0 }
        failureCode: { type: string }
        failureMessage: { type: string, maxLength: 240 }
        trigger: { type: string }
        scheduleId: { type: string }
        emergencyId: { type: string }
        sourceId: { type: string }
        selectedRecordId: { type: string }
        selectionDate: { type: string, format: date }
        sourceCachedAt: { type: string, format: date-time }
        sourceRevision: { type: string }
        snapshotHash: { type: string }
        metadata: { type: object, additionalProperties: true }
        priority: { type: integer, minimum: 0, maximum: 9 }
